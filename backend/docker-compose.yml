# Local development only — this is the "local Docker-based FastAPI backend"
# from the Phase 1 instruction. No database service: the API is stateless
# by design this phase (no PostGIS yet, per scope).
services:
  keymap-gis:
    build: .
    ports:
      - "8000:8000"
    environment:
      KEYMAP_ENVIRONMENT: local
      KEYMAP_LOG_LEVEL: INFO
      # Comma-separated; pydantic-settings parses this into the list field.
      KEYMAP_CORS_ORIGINS: '["http://localhost:5500","http://127.0.0.1:5500","https://motaseemabdalla0-ux.github.io"]'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
