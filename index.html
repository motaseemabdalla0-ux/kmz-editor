  function aiSay(html){ kmAiOut.innerHTML = html; }

  function runCommand(raw){
    const q = String(raw || '').trim();
    if(!q) return;
    if(!placemarks.length){ aiSay(escapeHtml(t('loadFileFirst'))); return; }
    // strip Arabic diacritics (shadda, harakat) so "قرّب" matches a "قرب" trigger, etc.
    const s = q.toLowerCase().replace(/[ً-ٰٟ]/g, '');
    const vis = activePlacemarks();

    // deleted / modified counts — checked before the generic count trigger below,
    // since "كم المحذوف" ("how many deleted") also contains "كم" ("how many")
    if(/deleted|محذوف/.test(s)){
      const n = placemarks.filter(pm=> pm.deleted).length;
      aiSay(t('aiDeletedCount', {n, total: placemarks.length}));
      return;
    }
    if(/modified|dirty|معدل/.test(s)){
      const n = placemarks.filter(pm=> pm.dirty).length;
      aiSay(t('aiModifiedCount', {n}));
      return;
    }

    // count / how many
    if(/\b(count|how many)\b|كم|عدد/.test(s)){
      aiSay(t('aiCount', {n: vis.length, total: placemarks.length, layers: sources.length}));
      return;
    }

    // numeric field comparison, e.g. "area > 500" / "المساحة أكبر من 500"
    // (checked before the generic "total area" trigger, since this phrasing usually contains "area"/"مساحة" too)
    const CMP_OPS = [
      [/أكبر من أو يساوي|>=|at least|no less than/i, '>='],
      [/أصغر من أو يساوي|<=|at most|no more than/i, '<='],
      [/أكبر من|اكبر من|greater than|more than|above|>/i, '>'],
      [/أصغر من|اصغر من|less than|below|</i, '<'],
      [/يساوي|equals/i, '=']
    ];
    let cmpFilter = null;
    for(const [re, sym] of CMP_OPS){
      const at = s.search(re);
      if(at === -1) continue;
      const hit = s.match(re)[0];
      const left = s.slice(0, at).trim();
      const right = s.slice(at + hit.length).trim();
      const num = (right.match(/[\d.]+/) || [])[0];
      if(left && num){ cmpFilter = {left, op: sym, num: parseFloat(num)}; break; }
    }
    if(cmpFilter){
      const keys = allFieldKeys();
      const term = cmpFilter.left;
      let key = keys.find(k=> term.includes(k.toLowerCase())) || keys.find(k=> k.toLowerCase().includes(term));
      // the query term is often in Arabic ("المساحة") while the data's field names are in English
      // ("Area (m2)") — fall back to the same area-field heuristic the KPI strip uses
      if(!key && /area|مساحة/.test(term)) key = areaFieldKey();
      if(!key){ aiSay(t('aiFilterNoField', {term: escapeHtml(cmpFilter.left)})); return; }
      const cmp = {'>':(a,b)=>a>b, '<':(a,b)=>a<b, '>=':(a,b)=>a>=b, '<=':(a,b)=>a<=b, '=':(a,b)=>a===b}[cmpFilter.op];
      const hits = vis.filter(pm=>{
        const v = parseFloat(String(fieldValueOf(pm, key)).replace(/,/g,''));
        return !isNaN(v) && cmp(v, cmpFilter.num);
      });
      if(hits.length){
        const prev = selectedPlacemarks(); selected.clear(); prev.forEach(refreshPlacemarkVisual);
        hits.forEach(pm=> setSelected(pm, true));
        renderTable();
      }
      aiSay(t('aiFilterResult', {n: hits.length, key: escapeHtml(key), op: cmpFilter.op, val: cmpFilter.num}));
      return;
    }

    // total area
    if(/area|مساحة|المساحة/.test(s)){
      const a = sumArea(vis);

    // largest / smallest plot
    if(/largest|biggest|أكبر قطعة|اكبر قطعة|smallest|أصغر قطعة|اصغر قطعة/.test(s)){
      const wantLargest = /largest|biggest|أكبر قطعة|اكبر قطعة/.test(s);
      const withArea = vis.filter(pm=> pm.rings).map(pm=> ({pm, a: placemarkAreaM2(pm)}));
      if(!withArea.length){ aiSay(t('aiNoGeom')); return; }
      withArea.sort((x,y)=> wantLargest ? y.a - x.a : x.a - y.a);
      const top = withArea[0];
      const prev = selectedPlacemarks(); selected.clear(); prev.forEach(refreshPlacemarkVisual);

        which: t(wantLargest ? 'aiExtremeLargest' : 'aiExtremeSmallest'),
        name: escapeHtml(top.pm.name), area: fmtNum(top.a)

    // basemap switch — checked hybrid before satellite, since "hybrid" queries often also say "satellite"
    if(/hybrid|هجين/.test(s)){ applyBasemap('hybrid'); aiSay(t('aiBasemapSwitched', {name: t('baseHybrid')})); return; }
    if(/satellite|قمر|صناعي/.test(s)){ applyBasemap('satellite'); aiSay(t('aiBasemapSwitched', {name: t('baseSatellite')})); return; }
    if(/street|شوارع/.test(s)){ applyBasemap('streets'); aiSay(t('aiBasemapSwitched', {name: t('baseStreets')})); return; }

    // fields list
    if(/\bfields\b|\bcolumns\b|الحقول|الأعمدة/.test(s)){
      const keys = allFieldKeys();

      if(!selectedPlacemarks().filter(plotVisible).length){ aiSay(t('tbExportNeedSelection')); return; }
      tbExportSel.click();
      aiSay(t('aiExportSelDone'));

    // select by a value that exists in the data
    const m = s.match(/(?:select|show|highlight|حدد|أظهر|اظهر)\s+(.+)/);
    if(m){
      const term = m[1].trim().replace(/^["']|["']$/g, '');
      const hits = vis.filter(pm=>
        pm.name.toLowerCase().includes(term) ||

        aiSay(t('aiNoMatch', {term: escapeHtml(term)}));
      }
      return;
    }
    aiSay(`<span class="warn">${escapeHtml(t('aiUnknown'))}</span>`);
  }

  // ================= KEYMAP geospatial toolkit (no external libraries) =================
  const EARTH_R = 6371008.8;                     // IUGG mean radius, metres
  const rad = d => d * Math.PI / 180;
  const deg = r => r * 180 / Math.PI;

  // great-circle distance between [lat,lng] pairs, metres
  function haversine(a, b){
    const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
    const s = Math.sin(dLat/2)**2 +
              Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng/2)**2;
    return 2 * EARTH_R * Math.asin(Math.min(1, Math.sqrt(s)));
  }

  // spherical excess area of a closed ring of [lat,lng], square metres
  function ringAreaM2(ring){
    if(!ring || ring.length < 3) return 0;
    let total = 0;
    for(let i = 0; i < ring.length; i++){
      const p1 = ring[i], p2 = ring[(i + 1) % ring.length];
      total += rad(p2[1] - p1[1]) * (2 + Math.sin(rad(p1[0])) + Math.sin(rad(p2[0])));
    }
    return Math.abs(total * EARTH_R * EARTH_R / 2);
  }

  // a placemark's true area: outer rings minus holes
  function placemarkAreaM2(pm){
    if(!pm.rings) return 0;
    let a = 0;
    pm.rings.forEach(part=>{
      a += ringAreaM2(part[0]);
      for(let h = 1; h < part.length; h++) a -= ringAreaM2(part[h]);
    });
    return Math.max(0, a);
  }

  function ringPerimeterM(ring){
    let p = 0;
    for(let i = 0; i < ring.length - 1; i++) p += haversine(ring[i], ring[i+1]);
    return p;
  }

  function placemarkCentroid(pm){
    if(!pm.rings) return null;
    // area-weighted centroid of the outer rings
    let cx = 0, cy = 0, wsum = 0;
    pm.rings.forEach(part=>{
      const ring = part[0], w = ringAreaM2(ring) || 1;
      let sx = 0, sy = 0;
      ring.forEach(p=>{ sy += p[0]; sx += p[1]; });
      cy += (sy / ring.length) * w; cx += (sx / ring.length) * w; wsum += w;
    });
    return wsum ? [cy / wsum, cx / wsum] : null;
  }

  // initial bearing a->b in degrees (0 = north)
  function bearingDeg(a, b){
    const y = Math.sin(rad(b[1]-a[1])) * Math.cos(rad(b[0]));
    const x = Math.cos(rad(a[0]))*Math.sin(rad(b[0])) -
              Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));
    return (deg(Math.atan2(y, x)) + 360) % 360;
  }

  // interior angle at b for the path a-b-c, degrees
  function angleAt(a, b, c){
    let d = Math.abs(bearingDeg(b, a) - bearingDeg(b, c));
    if(d > 180) d = 360 - d;
    return d;
  }

  function fmtDist(m){
    return m >= 1000 ? (m/1000).toFixed(2) + ' km' : m.toFixed(1) + ' m';
  }
  function fmtArea(m2){
    if(m2 >= 1e6) return (m2/1e6).toFixed(3) + ' km²';
    if(m2 >= 10000) return (m2/10000).toFixed(2) + ' ha';
    return m2.toFixed(1) + ' m²';
  }

  function clearMeasure(){

  function redrawMeasure(){
    measureLayers.forEach(l=> leafletMap.removeLayer(l));
    measureLayers = [];
    if(!measurePts.length) return;
    const style = {color:'#C89B3C', weight:2, dashArray:'6,4', fillColor:'#C89B3C', fillOpacity:.12};
    if(measureMode === 'area' && measurePts.length >= 3){
      measureLayers.push(L.polygon(measurePts, style).addTo(leafletMap));
    } else if(measurePts.length >= 2){
      measureLayers.push(L.polyline(measurePts, style).addTo(leafletMap));
    }
    measurePts.forEach(p=> measureLayers.push(
      L.circleMarker(p, {radius:4, color:'#C89B3C', fillColor:'#0B1220', fillOpacity:1, weight:2}).addTo(leafletMap)));

    let html = '';
    if(measureMode === 'distance'){
      let total = 0;
      for(let i = 0; i < measurePts.length - 1; i++) total += haversine(measurePts[i], measurePts[i+1]);
      const last = measurePts.length >= 2
        ? haversine(measurePts[measurePts.length-2], measurePts[measurePts.length-1]) : 0;
      html = `<b>${escapeHtml(t('measTotal'))}</b> ${fmtDist(total)}` +
             (last ? `<br>${escapeHtml(t('measSegment'))} ${fmtDist(last)}` : '') +
             (measurePts.length >= 2
               ? `<br>${escapeHtml(t('measBearing'))} ${bearingDeg(measurePts[measurePts.length-2], measurePts[measurePts.length-1]).toFixed(1)}°`
               : '');
    } else if(measureMode === 'area'){
      const ring = measurePts.slice();
      const a = ring.length >= 3 ? ringAreaM2(ring) : 0;
      const per = ring.length >= 2 ? ringPerimeterM(ring.concat([ring[0]])) : 0;
      html = `<b>${escapeHtml(t('measArea'))}</b> ${fmtArea(a)}` +
             `<br>${escapeHtml(t('measPerimeter'))} ${fmtDist(per)}` +
             `<br>${escapeHtml(t('measVertices'))} ${ring.length}`;
    } else {
      html = measurePts.length >= 3
        ? `<b>${escapeHtml(t('measAngle'))}</b> ${angleAt(measurePts[measurePts.length-3], measurePts[measurePts.length-2], measurePts[measurePts.length-1]).toFixed(1)}°`
        : escapeHtml(t('measAngleHint'));
    }
    measureHud.innerHTML = html +
      `<div style="margin-top:7px; display:flex; gap:5px;">
         <button data-meas="undo">${escapeHtml(t('measUndo'))}</button>
         <button data-meas="clear">${escapeHtml(t('measClear'))}</button>
       </div>`;
    measureHud.classList.add('show');
  }

  // ---------- Spatial join ----------
  function spatialJoin(sourceId, targetId, field){
    const src = placemarks.filter(p=>p.sourceId === sourceId);
    const tgt = placemarks.filter(p=>p.sourceId === targetId);
    const items = [];
    let matched = 0;      // target plots whose centroid falls inside a source plot
    let changed = 0;      // of those, how many actually got a new value written
    tgt.forEach(pm=>{
      const c = placemarkCentroid(pm);
      if(!c) return;
      const host = src.find(s=>{
        const layer = mapLayers[s.idx];
        return layer && layer.getBounds().contains(L.latLng(c[0], c[1])) &&
               pointInPlacemark(s, c[0], c[1]);
      });
      if(!host) return;
      matched++;
      const val = String(fieldValueOf(host, field));
      const existing = pm.fields.find(f=>f.key === field);
      if(existing && existing.val === val) return;   // spatially matched, nothing to update
      const before = snapshotAttrs(pm);
      if(existing) existing.val = val;
      else pm.fields.push({key: field, val});
      pm.dirty = true;
      writePlacemarkToDom(pm);
      items.push({pm, before, after: snapshotAttrs(pm)});
      changed++;
    });
    if(items.length) pushAttrChange(items, t('opSpatialJoin', {n: items.length}));
    return {matched, changed, target: tgt.length};
  }

  // ---------- Buffer ----------
  // offsets every outer-ring vertex outward along the angle bisector
  let bufferLayer = null;
  function buildBuffer(list, metres){
    if(bufferLayer){ leafletMap.removeLayer(bufferLayer); bufferLayer = null; }
    const shapes = [];
    list.forEach(pm=>{
      if(!pm.rings) return;
      const c = placemarkCentroid(pm);
      if(!c) return;
      const mPerDegLat = 111132.0;
      const mPerDegLng = 111320.0 * Math.cos(rad(c[0])) || 1;
      pm.rings.forEach(part=>{
        const ring = part[0];
        const out = ring.map(p=>{
          const dy = p[0] - c[0], dx = p[1] - c[1];
          const len = Math.hypot(dy * mPerDegLat, dx * mPerDegLng) || 1;
          return [p[0] + (dy * mPerDegLat / len) * metres / mPerDegLat,
                  p[1] + (dx * mPerDegLng / len) * metres / mPerDegLng];
        });
        shapes.push(out);
      });
    });
    if(!shapes.length) return 0;
    bufferLayer = L.polygon(shapes, {
      color:'#4C9AFF', weight:1.5, fillColor:'#4C9AFF', fillOpacity:.15, dashArray:'5,4', interactive:false
    }).addTo(leafletMap);
    bufferLayer.bringToBack();
    return shapes.length;
  }

  // ---------- Heatmap ----------
  let heatLayer = null;
  function buildHeatmap(on){
    if(heatLayer){ leafletMap.removeLayer(heatLayer); heatLayer = null; }
    if(!on) return 0;
    const pts = [];
    activePlacemarks().forEach(pm=>{ const c = placemarkCentroid(pm); if(c) pts.push(c); });
    if(!pts.length) return 0;
    const Heat = L.Layer.extend({
      onAdd(map){
        this._c = L.DomUtil.create('canvas', 'leaflet-zoom-animated');
        const size = map.getSize();
        this._c.width = size.x; this._c.height = size.y;
        map.getPanes().overlayPane.appendChild(this._c);
        this._c.style.pointerEvents = 'none';
        map.on('moveend zoomend resize', this._draw, this);
        this._draw();
      },
      onRemove(map){
        map.off('moveend zoomend resize', this._draw, this);
        if(this._c && this._c.parentNode) this._c.parentNode.removeChild(this._c);
      },
      _draw(){
        const map = this._map, size = map.getSize();
        const tl = map.containerPointToLayerPoint([0, 0]);
        L.DomUtil.setPosition(this._c, tl);
        this._c.width = size.x; this._c.height = size.y;
        const ctx = this._c.getContext('2d');
        ctx.clearRect(0, 0, size.x, size.y);
        const r = 26;
        pts.forEach(p=>{
          const q = map.latLngToContainerPoint(L.latLng(p[0], p[1]));
          if(q.x < -r || q.y < -r || q.x > size.x + r || q.y > size.y + r) return;
          const g = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r);
          g.addColorStop(0, 'rgba(200,155,60,.55)');
          g.addColorStop(.5, 'rgba(224,101,91,.28)');
          g.addColorStop(1, 'rgba(11,18,32,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fill();
        });
      }
    });
    heatLayer = new Heat();
    leafletMap.addLayer(heatLayer);
    return pts.length;
  }

  // ---------- Clustering ----------
  let clusterLayer = null;
  function buildClusters(on){
    if(clusterLayer){ leafletMap.removeLayer(clusterLayer); clusterLayer = null; }
    if(!on) return 0;
    const cell = 0.01;   // ~1.1 km grid
    const bins = new Map();
    activePlacemarks().forEach(pm=>{
      const c = placemarkCentroid(pm);
      if(!c) return;
      const key = Math.round(c[0]/cell) + ':' + Math.round(c[1]/cell);
      if(!bins.has(key)) bins.set(key, {lat:0, lng:0, n:0, ids:[]});
      const b = bins.get(key);
      b.lat += c[0]; b.lng += c[1]; b.n++; b.ids.push(pm.idx);
    });
    clusterLayer = L.layerGroup();
    bins.forEach(b=>{
      const size = Math.min(46, 22 + Math.log2(b.n + 1) * 5);
      const m = L.marker([b.lat/b.n, b.lng/b.n], {icon: L.divIcon({
        className:'km-cluster', iconSize:[size, size],
        html:`<span style="width:${size}px;height:${size}px">${b.n}</span>`
      })});

      clusterLayer.addLayer(m);

    clusterLayer.addTo(leafletMap);
    return bins.size;
  }

  // ---------- SQL-style filter ----------
  // FIELD OP VALUE [AND|OR ...]   field names may be "quoted"
  function parseSql(expr){
    const tokens = expr.split(/\s+(AND|OR|و|أو)\s+/i);
    const clauses = []; const joiners = [];
    for(let i = 0; i < tokens.length; i++){
      if(i % 2 === 1){ joiners.push(/^(or|أو)$/i.test(tokens[i]) ? 'OR' : 'AND'); continue; }
      const m = tokens[i].trim().match(/^(?:"([^"]+)"|'([^']+)'|([^\s><=!]+))\s*(>=|<=|!=|<>|=|>|<|LIKE|NOT LIKE)\s*(.+)$/i);
      if(!m) throw new Error(tokens[i].trim());
      const field = (m[1] || m[2] || m[3]).trim();
      const op = m[4].toUpperCase();
      let val = m[5].trim().replace(/^["']|["']$/g, '');
      clauses.push({field, op, val});
    }
    return {clauses, joiners};
  }

  function evalClause(pm, c){
    const raw = fieldValueOf(pm, c.field === '*' ? NAME_KEY : c.field);
    const a = String(raw).trim();
    const an = parseFloat(a.replace(/,/g, '')), bn = parseFloat(c.val.replace(/,/g, ''));
    const numeric = !isNaN(an) && !isNaN(bn);
    switch(c.op){
      case '=':  return numeric ? an === bn : a.toLowerCase() === c.val.toLowerCase();
      case '!=': case '<>': return numeric ? an !== bn : a.toLowerCase() !== c.val.toLowerCase();
      case '>':  return numeric ? an >  bn : a >  c.val;
      case '<':  return numeric ? an <  bn : a <  c.val;
      case '>=': return numeric ? an >= bn : a >= c.val;
      case '<=': return numeric ? an <= bn : a <= c.val;
      case 'LIKE': return a.toLowerCase().includes(c.val.toLowerCase().replace(/%/g, ''));
      case 'NOT LIKE': return !a.toLowerCase().includes(c.val.toLowerCase().replace(/%/g, ''));
    }
    return false;
  }

  function runSql(expr){
    const {clauses, joiners} = parseSql(expr);
    return activePlacemarks().filter(pm=>{
      let acc = evalClause(pm, clauses[0]);
      for(let i = 1; i < clauses.length; i++){
        const v = evalClause(pm, clauses[i]);
        acc = joiners[i-1] === 'OR' ? (acc || v) : (acc && v);
      }
      return acc;
    });
  }

  const measureHud = document.getElementById('kmMeasHud');
  Object.assign(ICONS, {
    ruler:'<path d="M15.5 3.5 20.5 8.5 8.5 20.5 3.5 15.5z"/><path d="M8 11l1.6 1.6M11 8l1.6 1.6M5.8 13.2l1.6 1.6M13.2 5.8l1.6 1.6"/>'
  });

  measureHud.addEventListener('click', (e)=>{
    const b = e.target.closest('button[data-meas]');
    if(!b) return;
    if(b.dataset.meas === 'undo'){ measurePts.pop(); redrawMeasure(); }
    else clearMeasure();
  });

  // cycle distance -> area -> angle each time the measure tool is re-picked.
  // Registered on the CAPTURE phase so it reads `mapTool` before the existing
  // bubble-phase toggle handler (bound earlier, in the base script) flips it —
  // otherwise this always sees mapTool already set to 'measure' and thinks it
  // was re-picked. When it IS a re-pick, stopPropagation keeps that bubble
  // handler from running at all — it would otherwise read the still-current
  // mapTool==='measure' and treat the click as "turn the tool off", instead of
  // "same tool, next mode". Turning measure off happens by picking a different
  // tool, not by re-clicking this one — see the tooltip text.
  const MEAS_MODES = ['distance','area','angle'];
  mapTools.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-tool="measure"]');
    if(!btn) return;
    const wasAlreadyMeasuring = mapTool === 'measure';
    if(wasAlreadyMeasuring){
      measureMode = MEAS_MODES[(MEAS_MODES.indexOf(measureMode) + 1) % 3];
      clearMeasure();
      showToast(t('measMode', {mode: t('measMode_' + measureMode)}));
      e.stopPropagation();
    } else {
      measureMode = 'distance';
    }
  }, true);

  // right-edge map controls
  document.getElementById('kmCompass').innerHTML = svgIcon('compass');
  document.getElementById('kmLocate').innerHTML = svgIcon('locate');
  document.getElementById('kmMiniToggle').innerHTML = svgIcon('map');
  document.getElementById('kmCompass').addEventListener('click', ()=>{
    leafletMap.setView(ALULA_VIEW.center, ALULA_VIEW.zoom);
    showToast(t('viewReset'));
  });
  document.getElementById('kmLocate').addEventListener('click', ()=>{
    const pts = [];
    activePlacemarks().forEach(pm=>{ if(pm.rings) pm.rings.forEach(part=> part.forEach(r=> r.forEach(p=> pts.push(p)))); });
    if(!pts.length){ showToast(t('noGeometry')); return; }
    leafletMap.fitBounds(pts, {padding:[50,50]});
  });
  let miniOn = false;
  document.getElementById('kmMiniToggle').addEventListener('click', (e)=>{
    miniOn = !miniOn; toggleMiniMap(miniOn);
    e.currentTarget.style.color = miniOn ? 'var(--gold)' : '';
  });
  document.getElementById('kmLabelToggle').addEventListener('click', (e)=>{
    labelsOn = !labelsOn;
    if(labelsOn && !labelField){
      const keys = allFieldKeys();
      labelField = keys.find(k=>/plot\s*id|parcel|name|رقم/i.test(k)) || NAME_KEY;
    }
    applyLabels();
    e.currentTarget.style.color = labelsOn ? 'var(--gold)' : '';
    showToast(labelsOn ? t('labelsOn', {field: labelField === NAME_KEY ? t('fieldName') : labelField}) : t('labelsOff'));
  });

  // ---- SQL filter ----
  document.getElementById('tbSqlRun').addEventListener('click', ()=>{
    const expr = document.getElementById('tbSql').value.trim();
    const out = document.getElementById('tbSqlOut');
    if(!expr){ out.textContent = t('tbSqlEmpty'); return; }
    let hits;
    try{ hits = runSql(expr); }
    catch(err){ out.innerHTML = `<span class="bad">${escapeHtml(t('tbSqlBad', {part: err.message}))}</span>`; return; }
    const prev = selectedPlacemarks(); selected.clear(); prev.forEach(refreshPlacemarkVisual);
    hits.forEach(pm=> setSelected(pm, true));
    renderTable();
    out.innerHTML = t('tbSqlHits', {n: hits.length});
    showToast(t('selectedN', {n: hits.length}));
  });

  // ---- spatial join ----
  function fillJoinSelects(){
    const src = document.getElementById('tbJoinSrc'), tgt = document.getElementById('tbJoinTgt');
    const fld = document.getElementById('tbJoinField');
    const opts = sources.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
    const keep = (el, html, idx)=>{ const v = el.value; el.innerHTML = html;
      if(v && [...el.options].some(o=>o.value===v)) el.value = v;
      else if(sources[idx]) el.value = String(sources[idx].id); };
    keep(src, opts, 0); keep(tgt, opts, 1);
    const f = fld.value;
    fld.innerHTML = allFieldKeys().map(k=>`<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('');
    if(f) fld.value = f;
  }
  document.getElementById('tbJoinRun').addEventListener('click', ()=>{
    const out = document.getElementById('tbJoinOut');
    const s = Number(document.getElementById('tbJoinSrc').value);
    const tg = Number(document.getElementById('tbJoinTgt').value);
    const field = document.getElementById('tbJoinField').value;
    if(s === tg){ out.innerHTML = `<span class="bad">${escapeHtml(t('tbJoinSame'))}</span>`; return; }
    const res = spatialJoin(s, tg, field);
    renderTable(); markSession();
    out.innerHTML = t('tbJoinOut', {matched: res.matched, changed: res.changed, total: res.target, field: escapeHtml(field)});
    showToast(t('tbJoinToast', {matched: res.matched, changed: res.changed}));
  });

  // ---- buffer ----
  document.getElementById('tbBufferRun').addEventListener('click', ()=>{
    const m = parseFloat(document.getElementById('tbBufferM').value);
    if(isNaN(m) || m <= 0){ showToast(t('tbBufferBad')); return; }
    const list = selected.size ? selectedPlacemarks().filter(plotVisible) : activePlacemarks();
    const n = buildBuffer(list, m);
    showToast(n ? t('tbBufferDone', {n, m}) : t('noGeometry'));
  });
  document.getElementById('tbBufferClear').addEventListener('click', ()=>{
    if(bufferLayer){ leafletMap.removeLayer(bufferLayer); bufferLayer = null; }
    showToast(t('tbBufferCleared'));
  });

  // ---- heatmap / clustering ----
  let heatOn = false, clusterOn = false;
  document.getElementById('tbHeat').addEventListener('click', (e)=>{
    heatOn = !heatOn;
    const n = buildHeatmap(heatOn);
    e.currentTarget.classList.toggle('active', heatOn);
    document.getElementById('tbVizOut').innerHTML = heatOn ? t('tbHeatOn', {n}) : t('tbVizOff');
  });
  document.getElementById('tbCluster').addEventListener('click', (e)=>{
    clusterOn = !clusterOn;
    const n = buildClusters(clusterOn);
    e.currentTarget.classList.toggle('active', clusterOn);
    document.getElementById('tbVizOut').innerHTML = clusterOn ? t('tbClusterOn', {n}) : t('tbVizOff');
  });

  // ---- bookmarks ----
  document.getElementById('tbBmAdd').addEventListener('click', ()=>{
    const name = prompt(t('bmPrompt'), t('bmDefault', {n: bookmarks.length + 1}));
    if(name === null) return;
    const c = leafletMap.getCenter();
    bookmarks.push({name: name.trim() || t('bmDefault', {n: bookmarks.length + 1}),
                    lat: c.lat, lng: c.lng, zoom: leafletMap.getZoom()});
    saveBookmarks(); renderBookmarks();
    showToast(t('bmSaved'));
  });
  document.getElementById('kmBookmarkList').addEventListener('click', (e)=>{
    const go = e.target.closest('button[data-bmgo]');
    if(go){ const b = bookmarks[Number(go.dataset.bmgo)];
      setView('map'); setTimeout(()=> leafletMap.setView([b.lat, b.lng], b.zoom), 60); return; }
    const del = e.target.closest('button[data-bmdel]');
    if(del){ bookmarks.splice(Number(del.dataset.bmdel), 1); saveBookmarks(); renderBookmarks(); }
  });

  // Keep the geo panels in step whenever the toolbox opens. NOTE: toolboxBtn's
  // original 'click' -> openToolbox listener was already bound by the base
  // script with a direct reference to that function *value* — reassigning the
  // `openToolbox` variable afterward (as tried earlier) does nothing, since
  // addEventListener doesn't re-read the variable at call time. An independent
  // listener sidesteps that entirely.
  toolboxBtn.addEventListener('click', ()=>{
    fillJoinSelects();
    renderBookmarks();
    paintIcons();
  });


  // ================= KEYMAP panel visibility system =================
  // Two independent layers of "hide when not needed, show on demand":
  //  1) whole-panel visibility (KPI strip, rails, toolbar, map toolbars) via
  //     the Panels menu in the header, persisted in localStorage
  //  2) per-card collapse (chevron on each card header) that just hides the
  //     body and keeps the title strip, persisted separately

  Object.assign(ICONS, {
    viewToggle:'<rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M3.5 9.7h17M9.7 9.7V20.5"/>',
    chevronDown:'<path d="m6 9.5 6 6 6-6"/>',
    xSmall:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>'
  });

  const PANEL_DEFS = [
    {id:'kpis',      el:'kmKpis',       icon:'stats',    label:'panelToggleKpis'},
    {id:'railLeft',  el:'kmRailLeft',   icon:'layers',   label:'panelToggleLayers'},
    {id:'railRight', el:'kmRailRight',  icon:'info',     label:'panelToggleInspector'},
    {id:'toolbar',   el:'toolbar',      icon:'sliders',  label:'panelToggleToolbar'},
    {id:'drawTools', el:'mapTools',     icon:'move',     label:'panelToggleDraw'},
    {id:'basemaps',  el:'mapBasemaps',  icon:'map',      label:'panelToggleBasemap'},
    {id:'fillMode',  el:'mapFillMode',  icon:'fill',     label:'panelToggleFill'},
    {id:'mapCtl',    el:'kmMapCtl',     icon:'compass',  label:'panelToggleMapCtl'}
  ];

  // panels that stay off until a sidebar nav item asks for them (map-only by default)
  const NAV_DRIVEN_PANELS = ['kpis', 'railLeft', 'railRight', 'toolbar'];

  let panelVis = {};
  try{ panelVis = JSON.parse(localStorage.getItem('keymapPanelVis2') || '{}'); }catch(e){}
  function isPanelOn(id){
    if(NAV_DRIVEN_PANELS.includes(id)) return panelVis[id] === true;
    return panelVis[id] !== false;
  }
  function savePanelVis(){ try{ localStorage.setItem('keymapPanelVis2', JSON.stringify(panelVis)); }catch(e){} }

  // turns on exactly the given nav-driven panels, turns off the rest -> keeps the main screen map-only otherwise
  function showOnlyMainPanels(ids){
    NAV_DRIVEN_PANELS.forEach(id=> panelVis[id] = ids.includes(id));
    savePanelVis(); applyPanelVisibility(); renderPanelsMenu();
  }

  const kmRestoreTab = document.getElementById('kmRestoreTab');

  function applyPanelVisibility(){
    PANEL_DEFS.forEach(def=>{
      const el = document.getElementById(def.el);
      if(!el) return;
      el.classList.toggle('km-panel-off', !isPanelOn(def.id));
    });
    // one small tab brings every hidden map toolbar back at once
    const mapToolIds = ['drawTools','basemaps','fillMode','mapCtl'];
    const anyMapToolHidden = mapToolIds.some(id=> !isPanelOn(id));
    if(kmRestoreTab) kmRestoreTab.classList.toggle('show', anyMapToolHidden);
    if(leafletMap) setTimeout(()=> leafletMap.invalidateSize(), 240);
  }

  function setPanel(id, on){
    panelVis[id] = on;
    savePanelVis();
    applyPanelVisibility();
    renderPanelsMenu();
  }

  function renderPanelsMenu(){
    const host = document.getElementById('kmPanelsList');
    if(!host) return;
    host.innerHTML = PANEL_DEFS.map(def=>`
      <div class="km-panel-row" data-panel-row="${def.id}">
        <span class="ico">${svgIcon(def.icon)}</span>
        <span class="lbl">${escapeHtml(t(def.label))}</span>
        <input type="checkbox" data-panel-check="${def.id}" ${isPanelOn(def.id) ? 'checked' : ''}>
      </div>`).join('');
  }

  document.getElementById('kmPanelsList')?.addEventListener('click', (e)=>{
    const row = e.target.closest('.km-panel-row');
    if(!row) return;
    const id = row.dataset.panelRow;
    const box = row.querySelector('input');
    const on = (e.target === box) ? box.checked : !isPanelOn(id);
    if(e.target !== box) box.checked = on;
    setPanel(id, on);
  });

  document.getElementById('kmPanelsShowAll')?.addEventListener('click', ()=>{
    PANEL_DEFS.forEach(def=> panelVis[def.id] = true);
    savePanelVis(); applyPanelVisibility(); renderPanelsMenu();
  });
  document.getElementById('kmPanelsReset')?.addEventListener('click', ()=>{
    panelVis = {}; savePanelVis(); applyPanelVisibility(); renderPanelsMenu();
  });

  const panelsMenuBtn = document.getElementById('panelsMenuBtn');
  const panelsPop = document.getElementById('kmPanelsPop');
  panelsMenuBtn?.addEventListener('click', (e)=>{
    e.stopPropagation();
    panelsPop.classList.toggle('open');
  });
  document.addEventListener('click', (e)=>{
    if(panelsPop && !panelsPop.contains(e.target) && e.target !== panelsMenuBtn) panelsPop.classList.remove('open');
  });

  kmRestoreTab?.addEventListener('click', ()=>{
    ['drawTools','basemaps','fillMode','mapCtl'].forEach(id=> panelVis[id] = true);
    savePanelVis(); applyPanelVisibility(); renderPanelsMenu();
  });

  // quick × dismiss buttons on the floating map toolbars themselves
  document.querySelectorAll('[data-panel-close]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      setPanel(btn.dataset.panelClose, false);
    });
  });

  // ---------- per-card collapse ----------
  let cardCollapse = {};
  try{ cardCollapse = JSON.parse(localStorage.getItem('keymapCardCollapse') || '{}'); }catch(e){}
  function applyCardCollapse(){
    document.querySelectorAll('.km-card[data-card-id]').forEach(card=>{
      card.classList.toggle('collapsed', !!cardCollapse[card.dataset.cardId]);
    });
  }
  document.querySelectorAll('.km-card-head[data-card-toggle], .km-ai-head[data-card-toggle]').forEach(head=>{
    head.addEventListener('click', (e)=>{
      if(e.target.closest('button:not(.km-card-collapse)')) return;   // let action buttons work normally
      const card = head.closest('.km-card');
      const id = card.dataset.cardId;
      if(!id) return;
      cardCollapse[id] = !cardCollapse[id];
      try{ localStorage.setItem('keymapCardCollapse', JSON.stringify(cardCollapse)); }catch(err){}
      card.classList.toggle('collapsed', cardCollapse[id]);
      if(leafletMap) setTimeout(()=> leafletMap.invalidateSize(), 240);
    });
  });

  applyPanelVisibility();
  renderPanelsMenu();
  applyCardCollapse();
  paintIcons();

  kmShellReady = true;
  refreshShell();
})();
</script>
</body>
</html>
