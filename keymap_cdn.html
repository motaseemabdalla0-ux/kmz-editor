  // mapTool==='measure' and treat the click as "turn the tool off", instead of
  // "same tool, next mode". Turning measure off happens by picking a different
  // tool, not by re-clicking this one — see the tooltip text.
  const MEAS_MODES = ['distance','area','angle'];
  mapTools.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-tool="measure"]');
    if(!btn) return;
    const wasAlreadyMeasuring = mapTool === 'measure';
    if(wasAlreadyMeasuring){
      measureMode = MEAS_MODES[(MEAS_MODES.indexOf(measureMode) + 1) % 3];
      clearMeasure();
      showToast(t('measMode', {mode: t('measMode_' + measureMode)}));
      e.stopPropagation();
    } else {
      measureMode = 'distance';
    }
  }, true);

  // right-edge map controls
  document.getElementById('kmCompass').innerHTML = svgIcon('compass');
  document.getElementById('kmLocate').innerHTML = svgIcon('locate');
  document.getElementById('kmMiniToggle').innerHTML = svgIcon('map');
  document.getElementById('kmCompass').addEventListener('click', ()=>{
    leafletMap.setView(ALULA_VIEW.center, ALULA_VIEW.zoom);
    showToast(t('viewReset'));
  });
  document.getElementById('kmLocate').addEventListener('click', ()=>{
    const pts = [];
    activePlacemarks().forEach(pm=>{ if(pm.rings) pm.rings.forEach(part=> part.forEach(r=> r.forEach(p=> pts.push(p)))); });
    if(!pts.length){ showToast(t('noGeometry')); return; }
    leafletMap.fitBounds(pts, {padding:[50,50]});
  });
  let miniOn = false;
  document.getElementById('kmMiniToggle').addEventListener('click', (e)=>{
    miniOn = !miniOn; toggleMiniMap(miniOn);
    e.currentTarget.style.color = miniOn ? 'var(--gold)' : '';
  });
  document.getElementById('kmLabelToggle').addEventListener('click', (e)=>{
    labelsOn = !labelsOn;
    if(labelsOn && !labelField){
      const keys = allFieldKeys();
      labelField = keys.find(k=>/plot\s*id|parcel|name|رقم/i.test(k)) || NAME_KEY;
    }
    applyLabels();
    e.currentTarget.style.color = labelsOn ? 'var(--gold)' : '';
    showToast(labelsOn ? t('labelsOn', {field: labelField === NAME_KEY ? t('fieldName') : labelField}) : t('labelsOff'));
  });

  // ---- SQL filter ----
  document.getElementById('tbSqlRun').addEventListener('click', ()=>{
    const expr = document.getElementById('tbSql').value.trim();
    const out = document.getElementById('tbSqlOut');
    if(!expr){ out.textContent = t('tbSqlEmpty'); return; }
    let hits;
    try{ hits = runSql(expr); }
    catch(err){ out.innerHTML = `<span class="bad">${escapeHtml(t('tbSqlBad', {part: err.message}))}</span>`; return; }
    const prev = selectedPlacemarks(); selected.clear(); prev.forEach(refreshPlacemarkVisual);
    hits.forEach(pm=> setSelected(pm, true));
    renderTable();
    out.innerHTML = t('tbSqlHits', {n: hits.length});
    showToast(t('selectedN', {n: hits.length}));
  });

  // ---- spatial join ----
  function fillJoinSelects(){
    const src = document.getElementById('tbJoinSrc'), tgt = document.getElementById('tbJoinTgt');
    const fld = document.getElementById('tbJoinField');
    const opts = sources.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
    const keep = (el, html, idx)=>{ const v = el.value; el.innerHTML = html;
      if(v && [...el.options].some(o=>o.value===v)) el.value = v;
      else if(sources[idx]) el.value = String(sources[idx].id); };
    keep(src, opts, 0); keep(tgt, opts, 1);
    const f = fld.value;
    fld.innerHTML = allFieldKeys().map(k=>`<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('');
    if(f) fld.value = f;
  }
  document.getElementById('tbJoinRun').addEventListener('click', ()=>{
    const out = document.getElementById('tbJoinOut');
    const s = Number(document.getElementById('tbJoinSrc').value);
    const tg = Number(document.getElementById('tbJoinTgt').value);
    const field = document.getElementById('tbJoinField').value;
    if(s === tg){ out.innerHTML = `<span class="bad">${escapeHtml(t('tbJoinSame'))}</span>`; return; }
    const res = spatialJoin(s, tg, field);
    renderTable(); markSession();
    out.innerHTML = t('tbJoinOut', {matched: res.matched, changed: res.changed, total: res.target, field: escapeHtml(field)});
    showToast(t('tbJoinToast', {matched: res.matched, changed: res.changed}));
  });

  // ---- buffer ----
  document.getElementById('tbBufferRun').addEventListener('click', ()=>{
    const m = parseFloat(document.getElementById('tbBufferM').value);
    if(isNaN(m) || m <= 0){ showToast(t('tbBufferBad')); return; }
    const list = selected.size ? selectedPlacemarks().filter(plotVisible) : activePlacemarks();
    const n = buildBuffer(list, m);
    showToast(n ? t('tbBufferDone', {n, m}) : t('noGeometry'));
  });
  document.getElementById('tbBufferClear').addEventListener('click', ()=>{
    if(bufferLayer){ leafletMap.removeLayer(bufferLayer); bufferLayer = null; }
    showToast(t('tbBufferCleared'));
  });

  // ---- heatmap / clustering ----
  let heatOn = false, clusterOn = false;
  document.getElementById('tbHeat').addEventListener('click', (e)=>{
    heatOn = !heatOn;
    const n = buildHeatmap(heatOn);
    e.currentTarget.classList.toggle('active', heatOn);
    document.getElementById('tbVizOut').innerHTML = heatOn ? t('tbHeatOn', {n}) : t('tbVizOff');
  });
  document.getElementById('tbCluster').addEventListener('click', (e)=>{
    clusterOn = !clusterOn;
    const n = buildClusters(clusterOn);
    e.currentTarget.classList.toggle('active', clusterOn);
    document.getElementById('tbVizOut').innerHTML = clusterOn ? t('tbClusterOn', {n}) : t('tbVizOff');
  });

  // ---- bookmarks ----
  document.getElementById('tbBmAdd').addEventListener('click', ()=>{
    const name = prompt(t('bmPrompt'), t('bmDefault', {n: bookmarks.length + 1}));
    if(name === null) return;
    const c = leafletMap.getCenter();
    bookmarks.push({name: name.trim() || t('bmDefault', {n: bookmarks.length + 1}),
                    lat: c.lat, lng: c.lng, zoom: leafletMap.getZoom()});
    saveBookmarks(); renderBookmarks();
    showToast(t('bmSaved'));
  });
  document.getElementById('kmBookmarkList').addEventListener('click', (e)=>{
    const go = e.target.closest('button[data-bmgo]');
    if(go){ const b = bookmarks[Number(go.dataset.bmgo)];
      setView('map'); setTimeout(()=> leafletMap.setView([b.lat, b.lng], b.zoom), 60); return; }
    const del = e.target.closest('button[data-bmdel]');
    if(del){ bookmarks.splice(Number(del.dataset.bmdel), 1); saveBookmarks(); renderBookmarks(); }
  });

  // Keep the geo panels in step whenever the toolbox opens. NOTE: toolboxBtn's
  // original 'click' -> openToolbox listener was already bound by the base
  // script with a direct reference to that function *value* — reassigning the
  // `openToolbox` variable afterward (as tried earlier) does nothing, since
  // addEventListener doesn't re-read the variable at call time. An independent
  // listener sidesteps that entirely.
  toolboxBtn.addEventListener('click', ()=>{
    fillJoinSelects();
    renderBookmarks();
    paintIcons();
  });


  // ================= KEYMAP panel visibility system =================
  // Two independent layers of "hide when not needed, show on demand":
  //  1) whole-panel visibility (KPI strip, rails, toolbar, map toolbars) via
  //     the Panels menu in the header, persisted in localStorage
  //  2) per-card collapse (chevron on each card header) that just hides the
  //     body and keeps the title strip, persisted separately

  Object.assign(ICONS, {
    viewToggle:'<rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M3.5 9.7h17M9.7 9.7V20.5"/>',
    chevronDown:'<path d="m6 9.5 6 6 6-6"/>',
    xSmall:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>'
  });

  const PANEL_DEFS = [
    {id:'kpis',      el:'kmKpis',       icon:'stats',    label:'panelToggleKpis'},
    {id:'railLeft',  el:'kmRailLeft',   icon:'layers',   label:'panelToggleLayers'},
    {id:'railRight', el:'kmRailRight',  icon:'info',     label:'panelToggleInspector'},
    {id:'toolbar',   el:'toolbar',      icon:'sliders',  label:'panelToggleToolbar'},
    {id:'drawTools', el:'mapTools',     icon:'move',     label:'panelToggleDraw'},
    {id:'basemaps',  el:'mapBasemaps',  icon:'map',      label:'panelToggleBasemap'},
    {id:'fillMode',  el:'mapFillMode',  icon:'fill',     label:'panelToggleFill'},
    {id:'mapCtl',    el:'kmMapCtl',     icon:'compass',  label:'panelToggleMapCtl'}
  ];

  // panels that stay off until a sidebar nav item asks for them (map-only by default)
  const NAV_DRIVEN_PANELS = ['kpis', 'railLeft', 'railRight', 'toolbar'];

  let panelVis = {};
  try{ panelVis = JSON.parse(localStorage.getItem('keymapPanelVis2') || '{}'); }catch(e){}
  function isPanelOn(id){
    if(NAV_DRIVEN_PANELS.includes(id)) return panelVis[id] === true;
    return panelVis[id] !== false;
  }
  function savePanelVis(){ try{ localStorage.setItem('keymapPanelVis2', JSON.stringify(panelVis)); }catch(e){} }

  // turns on exactly the given nav-driven panels, turns off the rest -> keeps the main screen map-only otherwise
  function showOnlyMainPanels(ids){
    NAV_DRIVEN_PANELS.forEach(id=> panelVis[id] = ids.includes(id));
    savePanelVis(); applyPanelVisibility(); renderPanelsMenu();
  }

  const kmHeaderActions = document.getElementById('kmHeaderActions');
  function setHeaderActions(show){
    if(kmHeaderActions) kmHeaderActions.classList.toggle('show', show);
  }

  const kmRestoreTab = document.getElementById('kmRestoreTab');

  function applyPanelVisibility(){
    PANEL_DEFS.forEach(def=>{
      const el = document.getElementById(def.el);
      if(!el) return;
      el.classList.toggle('km-panel-off', !isPanelOn(def.id));
    });
    // one small tab brings every hidden map toolbar back at once
    const mapToolIds = ['drawTools','basemaps','fillMode','mapCtl'];
    const anyMapToolHidden = mapToolIds.some(id=> !isPanelOn(id));
    if(kmRestoreTab) kmRestoreTab.classList.toggle('show', anyMapToolHidden);
    if(leafletMap) setTimeout(()=> leafletMap.invalidateSize(), 240);
  }

  function setPanel(id, on){
    panelVis[id] = on;
    savePanelVis();
    applyPanelVisibility();
    renderPanelsMenu();
  }

  function renderPanelsMenu(){
    const host = document.getElementById('kmPanelsList');
    if(!host) return;
    host.innerHTML = PANEL_DEFS.map(def=>`
      <div class="km-panel-row" data-panel-row="${def.id}">
        <span class="ico">${svgIcon(def.icon)}</span>
        <span class="lbl">${escapeHtml(t(def.label))}</span>
        <input type="checkbox" data-panel-check="${def.id}" ${isPanelOn(def.id) ? 'checked' : ''}>
      </div>`).join('');
  }

  document.getElementById('kmPanelsList')?.addEventListener('click', (e)=>{
    const row = e.target.closest('.km-panel-row');
    if(!row) return;
    const id = row.dataset.panelRow;
    const box = row.querySelector('input');
    const on = (e.target === box) ? box.checked : !isPanelOn(id);
    if(e.target !== box) box.checked = on;
    setPanel(id, on);
  });

  document.getElementById('kmPanelsShowAll')?.addEventListener('click', ()=>{
    PANEL_DEFS.forEach(def=> panelVis[def.id] = true);
    savePanelVis(); applyPanelVisibility(); renderPanelsMenu();
  });
  document.getElementById('kmPanelsReset')?.addEventListener('click', ()=>{
    panelVis = {}; savePanelVis(); applyPanelVisibility(); renderPanelsMenu();
  });

  const panelsMenuBtn = document.getElementById('panelsMenuBtn');
  const panelsPop = document.getElementById('kmPanelsPop');
  panelsMenuBtn?.addEventListener('click', (e)=>{
    e.stopPropagation();
    panelsPop.classList.toggle('open');
  });
  document.addEventListener('click', (e)=>{
    if(panelsPop && !panelsPop.contains(e.target) && e.target !== panelsMenuBtn) panelsPop.classList.remove('open');
  });

  kmRestoreTab?.addEventListener('click', ()=>{
    ['drawTools','basemaps','fillMode','mapCtl'].forEach(id=> panelVis[id] = true);
    savePanelVis(); applyPanelVisibility(); renderPanelsMenu();
  });

  // quick × dismiss buttons on the floating map toolbars themselves
  document.querySelectorAll('[data-panel-close]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      setPanel(btn.dataset.panelClose, false);
    });
  });

  // ---------- per-card collapse ----------
  let cardCollapse = {};
  try{ cardCollapse = JSON.parse(localStorage.getItem('keymapCardCollapse') || '{}'); }catch(e){}
  function applyCardCollapse(){
    document.querySelectorAll('.km-card[data-card-id]').forEach(card=>{
      card.classList.toggle('collapsed', !!cardCollapse[card.dataset.cardId]);
    });
  }
  document.querySelectorAll('.km-card-head[data-card-toggle], .km-ai-head[data-card-toggle]').forEach(head=>{
    head.addEventListener('click', (e)=>{
      if(e.target.closest('button:not(.km-card-collapse)')) return;   // let action buttons work normally
      const card = head.closest('.km-card');
      const id = card.dataset.cardId;
      if(!id) return;
      cardCollapse[id] = !cardCollapse[id];
      try{ localStorage.setItem('keymapCardCollapse', JSON.stringify(cardCollapse)); }catch(err){}
      card.classList.toggle('collapsed', cardCollapse[id]);
      if(leafletMap) setTimeout(()=> leafletMap.invalidateSize(), 240);
    });
  });

  applyPanelVisibility();
  renderPanelsMenu();
  applyCardCollapse();
  paintIcons();

  kmShellReady = true;
  refreshShell();
})();
</script>
</body>
</html>
