<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEYMAP — Geospatial Intelligence Platform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    /* ===== KEYMAP — Geospatial Intelligence Platform ===== */
    --bg:#0B1220;
    --bg-2:#0E1626;
    --surface:#141D30;
    --surface-2:#1A2438;
    --surface-3:#232F47;
    --glass:rgba(20,29,48,.72);
    --glass-hi:rgba(30,41,64,.78);
    --hairline:rgba(255,255,255,.08);
    --hairline-2:rgba(255,255,255,.14);
    --blur:16px;

    --gold:#C89B3C;
    --gold-hi:#E2B65C;
    --gold-dim:rgba(200,155,60,.15);
    --gold-soft:rgba(200,155,60,.22);

    --text:#E8ECF4;
    --text-2:#9AA6BD;
    --text-3:#6B7793;

    --danger:#E0655B;
    --danger-soft:rgba(224,101,91,.16);
    --danger-strong:#E0655B;
    --ok:#4FBF8B;
    --ok-soft:rgba(79,191,139,.16);

    /* legacy aliases — existing rules keep working against the dark ramp */
    --beige:#0B1220;
    --brown:#E8ECF4;
    --white:#141D30;
    --line:rgba(255,255,255,.09);
    --line-strong:rgba(255,255,255,.16);
    --ink-soft:#9AA6BD;
    --sandstone:#E2C6AA; --mountain:#805E45; --frankincense:#D6AD68;
    --ochre:#D08B67; --oldtown:#986018; --oasis:#14332D; --majdoul:#402022;

    --radius:12px;
    --radius-sm:8px;
    --radius-lg:16px;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 8px 24px rgba(0,0,0,.45);
    --shadow-3:0 20px 48px rgba(0,0,0,.55);
    --ease:cubic-bezier(.16,1,.3,1);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
    --sans: Inter, "Inter var", system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif;
  }  /* icon system: inline SVG, inherits colour and sits on the text baseline */
  .ico{display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  .ico svg{width:1.05em; height:1.05em; display:block;}
  .btn, .mini-btn, .view-btn, .map-tools button, .icon-btn, .file-label, .empty-cta, .lg-pick, .panel-close{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
  }
  .icon-btn, .lg-pick, .panel-close, .btn-icon{gap:0;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--beige);
    color:var(--brown);
    font-family:var(--sans);
    font-size:14px;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- Top bar ---------- */
  header{
    background:var(--brown);
    color:var(--beige);
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    border-bottom:3px solid var(--gold);
    flex-shrink:0;
  }
  header h1{
    font-size:16px;
    font-weight:700;
    margin:0;
    letter-spacing:.3px;
    white-space:nowrap;
  }
  header h1 span{color:var(--gold);}
  .spacer{flex:1;}
  .km-header-actions{display:none;}
  .km-header-actions.show{display:contents;}
  .km-header-end{display:flex; align-items:center; gap:16px; margin-inline-start:auto;}
  .btn{
    border:1px solid transparent;
    border-radius:var(--radius);
    padding:8px 16px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:filter .12s ease, transform .05s ease;
    font-family:var(--sans);
  }
  .btn:active{transform:translateY(1px);}
  .btn-gold{background:var(--gold); color:var(--brown);}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--beige); border-color:rgba(248,244,239,.35);}
  .btn-ghost:hover{background:rgba(248,244,239,.1);}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  input[type=file]{display:none;}

  .file-label{
    background:transparent;
    border:1px dashed rgba(248,244,239,.5);
    color:var(--beige);
    border-radius:var(--radius);
    padding:8px 16px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .file-label:hover{background:rgba(248,244,239,.08);}

  /* ---------- Loaded files popover ---------- */
  .files-wrap{position:relative;}
  .files-pop{
    display:none;
    position:absolute;
    top:calc(100% + 8px);
    inset-inline-start:0;
    min-width:320px;
    max-width:min(440px, 90vw);
    background:var(--white);
    color:var(--brown);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 8px 24px rgba(0,0,0,.22);
    padding:8px;
    z-index:1300;
  }
  .files-pop.open{display:block;}
  .fp-head{font-size:11px; font-weight:700; color:#8a8378; padding:2px 4px 6px;}
  .fp-note{font-size:10.5px; color:#8a8378; padding:6px 4px 2px; border-top:1px solid var(--line); line-height:1.6;}
  .src-row{
    display:flex; align-items:center; gap:6px;
    padding:5px 4px; border-bottom:1px solid #F0EBE1;
  }
  .src-row:last-of-type{border-bottom:none;}
  .src-name{flex:1; font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .src-count{font-family:var(--mono); font-size:11px; color:#8a8378; white-space:nowrap;}
  .src-row .icon-btn{width:24px; height:24px; font-size:11px;}

  /* ---------- Status / toolbar ---------- */
  .toolbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 20px;
    background:var(--white);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    flex-wrap:wrap;
  }
  .stat{
    font-size:12px;
    color:#6b6560;
    display:flex;
    gap:6px;
    align-items:baseline;
  }
  .stat b{font-size:15px; color:var(--brown); font-family:var(--mono);}
  .search-wrap{position:relative; flex:1; min-width:220px; max-width:420px;}
  .search-wrap input{
    width:100%;
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-size:13px;
    font-family:var(--sans);
    background:var(--beige);
    color:var(--brown);
  }
  .search-wrap input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .pill{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:99px;
    background:var(--ok-soft);
    color:var(--ok);
    white-space:nowrap;
  }
  .pill.warn{background:var(--gold-soft); color:#8a6d34;}
  .pill.danger{background:var(--danger-soft); color:var(--danger);}
  .pill.sel{background:#EFE3CC; color:#7a5f2a;}

  .mini-btn{
    border:1px solid var(--line);
    background:var(--white);
    color:var(--brown);
    font-size:12px;
    font-weight:700;
    padding:7px 12px;
    border-radius:var(--radius);
    cursor:pointer;
    font-family:var(--sans);
    white-space:nowrap;
  }
  .mini-btn:hover{border-color:var(--gold); background:var(--gold-soft);}
  .mini-btn.active{background:var(--brown); color:var(--gold); border-color:var(--brown);}
  .mini-btn:disabled{opacity:.4; cursor:not-allowed;}

  /* ---------- Welcome card, floating over the live map ---------- */
  .empty{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    z-index:500;
    display:flex;
    align-items:center;
    flex-direction:column;
    gap:14px;
    color:var(--ink-soft);
    text-align:center;
    padding:28px 30px;
    width:min(460px, calc(100% - 40px));
    background:rgba(255,255,255,.97);
    border:1px solid var(--line);
    border-top:3px solid var(--gold);
    border-radius:var(--radius);
    box-shadow:var(--shadow-3);
  }
  .empty svg{opacity:.55; color:var(--gold);}
  .empty p{line-height:1.8; font-size:13px; margin:0;}
  .empty .empty-cta{
    background:var(--gold); color:var(--brown);
    border:none; border-radius:var(--radius-sm);
    padding:10px 22px; font-size:13.5px; font-weight:700;
    cursor:pointer; font-family:var(--sans);
    display:inline-flex; align-items:center;
  }
  .empty .empty-cta:hover{filter:brightness(1.06);}

  /* ---------- View toggle ---------- */
  .view-toggle{
    display:flex;
    gap:0;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .view-btn{
    border:none;
    background:var(--white);
    color:var(--brown);
    font-size:12px;
    font-weight:700;
    padding:7px 14px;
    cursor:pointer;
    font-family:var(--sans);
  }
  .view-btn + .view-btn{border-inline-start:1px solid var(--line);}
  .view-btn.active{background:var(--brown); color:var(--gold);}

  /* ---------- Map ---------- */
  .map-wrap{
    flex:1;
    position:relative;
  }
  #map{
    width:100%;
    height:100%;
    background:#EFEAE0;
  }
  /* stacked panels anchored to the map's bottom-right corner */
  .map-panels{
    position:absolute;
    bottom:16px;
    right:16px;
    z-index:400;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:8px;
    width:min(260px, 45%);
    max-height:calc(100% - 120px);
  }
  .map-legend{
    background:rgba(255,255,255,.95);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 10px;
    font-size:11px;
    max-height:180px;
    overflow:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    flex-shrink:1;
    min-height:0;
  }
  .map-files{max-height:200px;}
  .map-files .lg-row, .map-legend .lg-row{cursor:pointer;}
  .map-files .lg-row input, .map-legend .lg-row input{width:13px; height:13px; flex-shrink:0;}
  .lg-row.off .lg-name{opacity:.45; text-decoration:line-through;}
  .lg-row.off .lg-swatch{opacity:.3;}
  .lg-pick{
    border:1px solid var(--line); background:var(--white); color:var(--brown);
    border-radius:3px; font-size:10px; line-height:1; padding:3px 5px;
    cursor:pointer; flex-shrink:0; font-family:var(--sans);
  }
  .lg-pick:hover{border-color:var(--gold); background:var(--gold-soft);}
  .lg-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lg-head-row{
    display:flex; align-items:center; gap:6px;
    font-weight:700; font-size:10px; color:#8a8378;
    padding:0 4px 5px; border-bottom:1px solid var(--line); margin-bottom:4px;
  }
  .lg-head-row .lg-name{flex:1;}
  .lg-head-row button{
    border:1px solid var(--line); background:var(--white); color:var(--brown);
    border-radius:3px; font-size:10px; font-weight:700; padding:2px 7px;
    cursor:pointer; font-family:var(--sans);
  }
  .lg-head-row button:hover{background:var(--gold-soft); border-color:var(--gold);}
  .map-legend .lg-row{
    display:flex; align-items:center; gap:6px; padding:3px 4px;
    cursor:pointer; border-radius:4px; user-select:none;
  }
  .map-legend .lg-row:hover{background:var(--gold-soft);}
  .map-legend .lg-swatch{width:11px; height:11px; border-radius:2px; flex-shrink:0; border:1px solid rgba(0,0,0,.2);}
  .map-legend .lg-count{margin-inline-start:auto; font-family:var(--mono); font-size:10px; color:#8a8378;}
  .map-legend .lg-head{font-weight:700; font-size:10px; color:#8a8378; padding:0 4px 4px; border-bottom:1px solid var(--line); margin-bottom:4px;}
  .map-hint{
    position:absolute;
    bottom:16px;
    left:12px;
    z-index:400;
    background:rgba(61,57,54,.85);
    color:var(--beige);
    font-size:11px;
    line-height:1.7;
    padding:6px 12px;
    border-radius:10px;
    max-width:min(52%, 460px);
  }
  body.has-batch .map-hint{bottom:calc(16px + var(--batch-h, 60px));}
  .leaflet-crosshair, .leaflet-crosshair .leaflet-interactive{cursor:crosshair !important;}
  .map-tools{
    position:absolute;
    top:12px; right:12px;
    z-index:400;
    display:flex; gap:3px;
    background:rgba(255,255,255,.96);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:4px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
  }
  .map-tools button{
    border:1px solid transparent;
    background:transparent;
    color:var(--brown);
    font-family:var(--sans);
    font-size:11.5px;
    font-weight:700;
    padding:6px 9px;
    border-radius:4px;
    cursor:pointer;
    white-space:nowrap;
  }
  .map-tools button:hover{background:var(--gold-soft);}
  .map-tools button.active{background:var(--brown); color:var(--gold);}
  .map-basemaps{top:56px;}
  .map-offline{
    display:none;
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    z-index:390;
    background:rgba(255,255,255,.94);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 16px;
    font-size:12px;
    max-width:min(80%, 420px);
    text-align:center;
    line-height:1.7;
    color:#6b6560;
    pointer-events:none;
  }
  .tiles-down .map-offline{display:block;}
  .tiles-down #map{background:#EFEAE0;}
  .map-basemaps button.active{background:var(--gold); color:var(--brown);}
  .map-fillmode{top:100px;}
  .map-fillmode button.active{background:var(--brown); color:var(--gold);}
  .map-popup{font-family:var(--sans); min-width:240px; max-width:300px;}
  .map-popup .mp-header{display:flex; align-items:center; gap:2px; margin-bottom:1px;}
  .map-popup .mp-title{flex:1; font-weight:700; font-size:13px; margin:0; color:var(--brown); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .map-popup .mp-sub{font-size:11px; font-weight:700; margin:0 0 8px; letter-spacing:.2px;}
  .map-popup .mp-icon{
    width:22px; height:22px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    border-radius:6px; background:transparent; border:none; cursor:pointer; color:#8a8378;
  }
  .map-popup .mp-icon:hover{background:rgba(0,0,0,.06);}
  .map-popup .mp-icon svg{width:13px; height:13px;}
  .map-popup .mp-body-scroll{max-height:260px; overflow-y:auto; margin:0 -2px;}
  .map-popup .mp-table{width:100%; border-collapse:collapse; font-size:11.5px;}
  .map-popup .mp-table td{padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top;}
  .map-popup .mp-table tr:last-child td{border-bottom:none;}
  .map-popup .mp-table td:first-child{color:#8a8378; font-weight:600; white-space:nowrap; padding-inline-end:14px;}
  .map-popup .mp-table td:last-child{color:var(--brown); text-align:end; word-break:break-word;}
  .map-popup .mp-empty{font-size:11.5px; color:#8a8378; padding:6px 2px;}
  .map-popup .mp-pager{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding-top:8px; margin-top:8px; border-top:1px solid var(--line);
  }
  .map-popup .mp-nav{display:flex; align-items:center; gap:5px;}
  .map-popup .mp-arrow{
    width:20px; height:20px; border:1px solid var(--line); background:var(--white);
    border-radius:5px; color:var(--brown); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .map-popup .mp-arrow:hover{border-color:var(--gold);}
  .map-popup .mp-arrow:disabled{opacity:.35; cursor:not-allowed;}
  .map-popup .mp-arrow svg{width:11px; height:11px;}
  .map-popup .mp-count{font-size:10.5px; color:#8a8378; font-variant-numeric:tabular-nums;}
  .map-popup .mp-viewall{background:transparent; border:none; color:var(--gold); font-size:11px; font-weight:700; cursor:pointer; padding:0;}
  .map-popup .mp-viewall:hover{text-decoration:underline;}
  .map-popup .mp-actions{display:flex; gap:6px; margin-top:9px;}
  .btn-sm{padding:5px 10px !important; font-size:12px !important;}
  .leaflet-popup-content-wrapper{border-radius:6px; border:1px solid var(--gold);}
  .leaflet-popup-content{margin:10px 12px;}

  /* ---------- Table ---------- */
  .table-wrap{
    flex:1;
    overflow:auto;
    position:relative;
  }
  table{
    border-collapse:collapse;
    width:100%;
    font-size:12.5px;
    font-family:var(--mono);
  }
  thead th{
    position:sticky;
    top:0;
    background:var(--brown);
    color:var(--gold-soft);
    text-align:start;
    padding:9px 10px;
    font-weight:700;
    font-family:var(--sans);
    font-size:11.5px;
    white-space:nowrap;
    border-bottom:2px solid var(--gold);
    z-index:2;
  }
  /* logical inset so the frozen columns follow the reading direction */
  thead th:nth-child(1){position:sticky; inset-inline-start:0; z-index:4; width:36px; min-width:36px; padding:9px 6px; text-align:center;}
  thead th:nth-child(2){position:sticky; inset-inline-start:36px; z-index:3;}
  thead th.sortable{cursor:pointer; user-select:none;}
  thead th.sortable:hover{background:#4a4541;}
  tbody td{
    padding:7px 10px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
    max-width:220px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  tbody td:nth-child(1){
    position:sticky;
    inset-inline-start:0;
    z-index:2;
    width:36px;
    min-width:36px;
    padding:7px 6px;
    text-align:center;
    overflow:visible;
  }
  tbody td:nth-child(2){
    position:sticky;
    inset-inline-start:36px;
    font-family:var(--sans);
    font-weight:600;
    z-index:1;
  }
  input[type=checkbox]{accent-color:var(--gold); width:15px; height:15px; cursor:pointer;}
  tbody tr:nth-child(odd) td{background:var(--white);}
  tbody tr:nth-child(even) td{background:#FBF9F5;}
  tbody tr:hover td{background:var(--gold-soft) !important;}
  tbody tr.modified td{border-top:1px solid var(--gold);}
  tbody tr.modified td:nth-child(2)::before{
    content:"●";
    color:var(--gold);
    margin-inline-end:6px;
    font-size:9px;
  }
  tbody tr.deleted td{
    background:var(--danger-soft) !important;
    color:#a08b86;
    text-decoration:line-through;
  }
  tbody tr.deleted td:nth-child(2)::before{ content:""; }
  tbody tr.selected td{background:#FCF2DC !important; text-decoration:none;}
  tbody tr.selected.deleted td{background:#F6DED9 !important; text-decoration:line-through;}
  [dir=rtl] tbody tr.selected td:nth-child(1){box-shadow:inset 3px 0 0 var(--gold);}
  [dir=ltr] tbody tr.selected td:nth-child(1){box-shadow:inset -3px 0 0 var(--gold);}
  .row-actions{display:flex; gap:6px; white-space:nowrap;}
  .icon-btn{
    border:1px solid var(--line);
    background:var(--white);
    border-radius:4px;
    width:28px; height:28px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-family:var(--sans);
    font-size:13px;
    color:var(--brown);
  }
  .icon-btn:hover{border-color:var(--gold); background:var(--gold-soft);}
  .icon-btn.danger:hover{border-color:var(--danger); background:var(--danger-soft); color:var(--danger);}

  /* ---------- Edit panel (slide-in) ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(61,57,54,.35);
    display:none;
    z-index:1000;
  }
  .overlay.open{display:block;}
  .panel{
    position:fixed;
    top:0; bottom:0; left:0;
    width:min(420px, 92vw);
    background:var(--white);
    box-shadow:8px 0 24px rgba(0,0,0,.15);
    transform:translateX(-100%);
    transition:transform .18s ease;
    z-index:1100;
    display:flex;
    flex-direction:column;
    border-left:4px solid var(--line);
  }
  .panel.open{transform:translateX(0);}
  .panel.has-changes{border-left-color:var(--gold);}
  /* selection panel slides in from the opposite edge */
  .panel-right{
    left:auto; right:0;
    transform:translateX(100%);
    border-left:none;
    border-right:4px solid var(--gold);
    box-shadow:-8px 0 24px rgba(0,0,0,.15);
    width:min(400px, 92vw);
  }
  .panel-right.open{transform:translateX(0);}

  .seg{display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .seg button{
    flex:1; border:none; background:var(--white); color:var(--brown);
    font-family:var(--sans); font-size:11.5px; font-weight:700;
    padding:8px 4px; cursor:pointer;
  }
  .seg button + button{border-inline-start:1px solid var(--line);}
  .seg button.active{background:var(--brown); color:var(--gold);}

  .sel-sec{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    display:flex; flex-direction:column; gap:8px;
    background:#FCFAF6;
  }
  .sel-sec > h3{
    margin:0; font-size:12px; color:var(--brown);
    display:flex; align-items:center; gap:6px;
  }
  .sel-sec select, .sel-sec input[type=text], .sel-sec textarea{
    border:1px solid var(--line); border-radius:4px;
    padding:7px 9px; font-size:12.5px; font-family:var(--mono);
    background:var(--white); color:var(--brown); width:100%;
  }
  .sel-sec select:focus, .sel-sec input:focus, .sel-sec textarea:focus{outline:2px solid var(--gold);}
  .val-list{
    max-height:230px; overflow:auto;
    border:1px solid var(--line); border-radius:4px;
    background:var(--white);
  }
  .val-row{
    display:flex; align-items:center; gap:8px;
    padding:5px 9px; font-size:12px; cursor:pointer;
    border-bottom:1px solid #F0EBE1;
  }
  .val-row:hover{background:var(--gold-soft);}
  .val-row:last-child{border-bottom:none;}
  .val-row .vr-label{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .val-row .vr-count{font-family:var(--mono); font-size:10.5px; color:#8a8378;}
  .val-empty{padding:14px; text-align:center; color:#8a8378; font-size:12px;}
  .mini-row{display:flex; gap:6px;}
  .mini-row .mini-btn{flex:1; padding:6px 8px; font-size:11px;}
  .sel-hint{font-size:11px; color:#8a8378; line-height:1.6; min-height:16px;}
  .sel-hint b{color:var(--brown); font-family:var(--mono);}
  .sel-hint .bad{color:var(--danger);}
  .sel-hint .good{color:var(--ok);}
  .btn-icon{padding:8px 12px; font-size:15px; line-height:1;}
  .stats-grid{
    display:grid; grid-template-columns:auto 1fr; gap:4px 12px;
    font-size:12px; padding:6px 2px;
  }
  .stats-grid .sk{color:#8a8378; font-weight:700; font-size:11px;}
  .stats-grid .sv{font-family:var(--mono); text-align:end; font-variant-numeric:tabular-nums;}
  .stats-empty{font-size:11.5px; color:#8a8378; padding:6px 2px;}
  .panel-head{
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .panel-head h2{font-size:14px; margin:0; flex:1;}
  .panel-close{
    background:none; border:none; font-size:18px; cursor:pointer; color:#8a8378;
  }
  .panel-body{
    flex:1;
    overflow:auto;
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:11px; color:#8a8378; font-weight:700;}
  .field input, .field textarea{
    border:1px solid var(--line);
    border-radius:4px;
    padding:7px 9px;
    font-size:13px;
    font-family:var(--mono);
    background:var(--beige);
    color:var(--brown);
  }
  .field input:focus, .field textarea:focus{outline:2px solid var(--gold); outline-offset:0; background:var(--white);}
  .field.changed input, .field.changed textarea{border-color:var(--gold); background:#FFFBF2;}
  .panel-foot{
    padding:14px 18px;
    border-top:1px solid var(--line);
    display:flex;
    gap:8px;
  }
  .panel-foot .btn{flex:1;}
  .btn-outline{background:var(--white); border-color:var(--line); color:var(--brown);}
  .btn-outline:hover{border-color:var(--gold);}
  .btn-danger{background:var(--white); border-color:var(--danger); color:var(--danger);}
  .btn-danger:hover{background:var(--danger-soft);}

  /* ---------- Batch selection bar ---------- */
  .batchbar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--brown);
    color:var(--beige);
    display:none;
    align-items:center;
    gap:8px;
    padding:10px 20px;
    /* must clear Leaflet's panes/controls (up to z-index 800), which are not
       inside a stacking context of their own */
    z-index:900;
    border-top:3px solid var(--gold);
    flex-wrap:wrap;
    box-shadow:0 -4px 18px rgba(0,0,0,.18);
  }
  .batchbar.show{display:flex;}
  .bb-count{font-size:13px; display:flex; align-items:baseline; gap:6px;}
  .bb-count b{font-family:var(--mono); font-size:18px; color:var(--gold);}
  .bb-note{font-size:11px; color:rgba(248,244,239,.6);}
  .batchbar .btn{padding:7px 14px;}
  .btn-danger-solid{background:var(--danger); color:#fff;}
  .btn-danger-solid:hover{filter:brightness(1.1);}
  /* --batch-h is set from JS to the bar's real (possibly wrapped) height */
  body.has-batch .map-panels{bottom:calc(16px + var(--batch-h, 60px));}
  body.has-batch .leaflet-control-attribution{margin-bottom:var(--batch-h, 60px);}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--brown); color:var(--beige);
    padding:10px 18px; border-radius:99px; font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,.2);
    opacity:0; pointer-events:none; transition:opacity .2s ease, bottom .2s ease;
    z-index:1200;
    border:1px solid var(--gold);
  }
  .toast.show{opacity:1; bottom:30px;}
  body.has-batch .toast.show{bottom:calc(24px + var(--batch-h, 60px));}

  /* ================= KEYMAP dark surface layer ================= */
  body{background:var(--bg); color:var(--text);}
  ::selection{background:var(--gold-soft); color:var(--text);}
  *:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:4px;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:99px; border:2px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:#31405e;}

  /* glass chrome */
  header{
    background:var(--glass); backdrop-filter:blur(var(--blur)) saturate(1.3);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);
    border-bottom:1px solid var(--hairline); color:var(--text);
    padding:12px 20px;
  }
  header h1{font-size:15px; font-weight:600; letter-spacing:-.2px; display:flex; flex-direction:column; gap:1px;}
  header h1 .brand{font-size:17px; font-weight:700; letter-spacing:2.5px; color:var(--text);}
  header h1 .brand em{font-style:normal; color:var(--gold);}
  header h1 .tagline{font-size:9.5px; font-weight:500; letter-spacing:1.6px;
    text-transform:uppercase; color:var(--text-3);}
  .toolbar{
    background:var(--glass); backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    border-bottom:1px solid var(--hairline); padding:9px 20px;
  }

  /* controls */
  .btn, .mini-btn, .view-btn, .file-label, .icon-btn, .lg-pick, .empty-cta, .map-tools button{
    transition:background .18s var(--ease), color .18s var(--ease),
               border-color .18s var(--ease), transform .12s var(--ease);
  }
  .btn{border-radius:var(--radius-sm); font-weight:600;}
  .btn-gold{background:var(--gold); color:#141005; border-color:transparent;}
  .btn-gold:hover{background:var(--gold-hi); filter:none;}
  .btn-ghost{background:rgba(255,255,255,.05); color:var(--text-2); border-color:var(--hairline);}
  .btn-ghost:hover{background:rgba(255,255,255,.09); color:var(--text);}
  .btn-outline{background:transparent; border-color:var(--hairline-2); color:var(--text-2);}
  .btn-outline:hover{border-color:var(--gold); color:var(--text);}
  .btn-danger{background:transparent; border-color:rgba(224,101,91,.5); color:var(--danger);}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-danger-solid{background:var(--danger); color:#1a0d0c;}
  .file-label{border:1px dashed var(--hairline-2); color:var(--text-2); border-radius:var(--radius-sm);}
  .file-label:hover{border-color:var(--gold); color:var(--text); background:var(--gold-dim);}
  .mini-btn{background:rgba(255,255,255,.04); border-color:var(--hairline); color:var(--text-2); border-radius:var(--radius-sm);}
  .mini-btn:hover{background:rgba(255,255,255,.08); border-color:var(--hairline-2); color:var(--text);}
  .mini-btn.active{background:var(--gold); border-color:var(--gold); color:#141005;}
  .view-toggle{border-color:var(--hairline); border-radius:var(--radius-sm); background:rgba(255,255,255,.04);}
  .view-btn{background:transparent; color:var(--text-3);}
  .view-btn:hover{color:var(--text);}
  .view-btn.active{background:var(--gold); color:#141005;}
  .view-btn + .view-btn{border-inline-start-color:var(--hairline);}
  .icon-btn{background:rgba(255,255,255,.04); border-color:var(--hairline); color:var(--text-2); border-radius:6px;}
  .icon-btn:hover{border-color:var(--gold); background:var(--gold-dim); color:var(--gold);}
  .icon-btn.danger:hover{border-color:var(--danger); background:var(--danger-soft); color:var(--danger);}
  .btn:disabled, .icon-btn:disabled{opacity:.3;}

  /* fields */
  .search-wrap input, .field input, .field textarea, .sel-sec select,
  .sel-sec input[type=text], .sel-sec textarea{
    background:rgba(255,255,255,.04); border-color:var(--hairline);
    color:var(--text); border-radius:var(--radius-sm);
  }
  .search-wrap input::placeholder, .sel-sec input::placeholder, .sel-sec textarea::placeholder{color:var(--text-3);}
  .search-wrap input:focus, .field input:focus, .field textarea:focus{
    outline:none; border-color:var(--gold); background:rgba(255,255,255,.07);
    box-shadow:0 0 0 3px var(--gold-dim);
  }
  .stat{color:var(--text-3);}
  .stat b{color:var(--text); font-variant-numeric:tabular-nums;}
  .pill{background:var(--gold-dim); color:var(--gold);}
  .pill.warn{background:var(--gold-dim); color:var(--gold-hi);}
  .pill.danger{background:var(--danger-soft); color:var(--danger);}

  /* floating map panels — glass */
  .map-tools, .map-legend, .map-hint, .map-offline, .files-pop, .empty{
    background:var(--glass); backdrop-filter:blur(var(--blur)) saturate(1.25);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(1.25);
    border:1px solid var(--hairline); color:var(--text);
    border-radius:var(--radius); box-shadow:var(--shadow-2);
  }
  .map-tools button{color:var(--text-2); border-radius:7px;}
  .map-tools button:hover{background:rgba(255,255,255,.07); color:var(--text);}
  .map-tools button.active, .map-basemaps button.active, .map-fillmode button.active{
    background:var(--gold); color:#141005;
  }
  .map-hint{color:var(--text-2); font-size:11px;}
  .map-legend .lg-row:hover, .map-files .lg-row:hover{background:rgba(255,255,255,.06);}
  .lg-head, .lg-head-row{color:var(--text-3); border-color:var(--hairline);}
  .lg-head-row button{background:rgba(255,255,255,.05); border-color:var(--hairline); color:var(--text-2); border-radius:5px;}
  .lg-head-row button:hover{background:var(--gold-dim); border-color:var(--gold); color:var(--gold);}
  .lg-count, .src-count{color:var(--text-3);}
  .lg-pick{background:rgba(255,255,255,.05); border-color:var(--hairline); color:var(--text-2);}
  .lg-pick:hover{background:var(--gold-dim); border-color:var(--gold); color:var(--gold);}
  .empty{border-top:2px solid var(--gold); border-radius:var(--radius-lg);}
  .empty p{color:var(--text-2);}
  .empty svg{color:var(--gold); opacity:.85;}
  .empty-cta{background:var(--gold); color:#141005; border-radius:var(--radius-sm);}
  .empty-cta:hover{background:var(--gold-hi);}
  .files-pop{border-radius:var(--radius);}
  .fp-head, .fp-note{color:var(--text-3); border-color:var(--hairline);}
  .src-row{border-color:var(--hairline);}
  .src-name{color:var(--text);}

  /* table */
  .table-wrap{background:var(--bg);}
  thead th{background:var(--surface-2); color:var(--text-2); border-bottom:1px solid var(--hairline-2);}
  thead th.sortable:hover{background:var(--surface-3); color:var(--text);}
  tbody td{border-bottom:1px solid rgba(255,255,255,.05); color:var(--text-2);}
  tbody tr:nth-child(odd) td{background:var(--bg);}
  tbody tr:nth-child(even) td{background:#0D1523;}
  tbody tr:hover td{background:var(--surface-2) !important; color:var(--text);}
  tbody td:nth-child(2){color:var(--text);}
  tbody tr.selected td{background:rgba(200,155,60,.13) !important;}
  tbody tr.selected.deleted td{background:rgba(224,101,91,.14) !important;}
  tbody tr.deleted td{background:rgba(224,101,91,.09) !important; color:var(--text-3);}
  [dir=rtl] tbody tr.selected td:nth-child(1){box-shadow:inset 3px 0 0 var(--gold);}
  [dir=ltr] tbody tr.selected td:nth-child(1){box-shadow:inset -3px 0 0 var(--gold);}
  input[type=checkbox]{accent-color:var(--gold);}

  /* panels */
  .overlay{background:rgba(5,9,17,.62); backdrop-filter:blur(3px);}
  .panel{
    background:var(--surface); border:1px solid var(--hairline);
    box-shadow:var(--shadow-3); border-left:none; border-right:none;
  }
  .panel-right{border-inline-start:1px solid var(--hairline);}
  .panel-head, .panel-foot{border-color:var(--hairline);}
  .panel-head h2{color:var(--text); font-weight:600;}
  .panel-close{color:var(--text-3); border-radius:6px;}
  .panel-close:hover{color:var(--text); background:rgba(255,255,255,.07);}
  .field label{color:var(--text-3);}
  .field.changed input, .field.changed textarea{border-color:var(--gold); background:var(--gold-dim);}
  .sel-sec{background:rgba(255,255,255,.03); border-color:var(--hairline); border-radius:var(--radius);}
  .sel-sec > h3{color:var(--text);}
  .sel-hint{color:var(--text-3);}
  .sel-hint b{color:var(--text);}
  .val-list{background:rgba(0,0,0,.25); border-color:var(--hairline); border-radius:var(--radius-sm);}
  .val-row{border-color:rgba(255,255,255,.05);}
  .val-row:hover{background:rgba(255,255,255,.06);}
  .val-empty, .stats-empty{color:var(--text-3);}
  .seg{border-color:var(--hairline); border-radius:var(--radius-sm); background:rgba(255,255,255,.04);}
  .seg button{background:transparent; color:var(--text-3);}
  .seg button:hover{color:var(--text);}
  .seg button.active{background:var(--gold); color:#141005;}
  .seg button + button{border-inline-start-color:var(--hairline);}
  .stats-grid .sk{color:var(--text-3);}
  .stats-grid .sv{color:var(--text);}

  /* batch bar */
  .batchbar{
    background:var(--glass); backdrop-filter:blur(var(--blur)) saturate(1.3);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(1.3);
    border-top:1px solid var(--gold); color:var(--text); box-shadow:var(--shadow-3);
  }
  .bb-count b{color:var(--gold);}
  .bb-note{color:var(--text-3);}
  .toast{
    background:var(--surface-2); color:var(--text);
    border:1px solid var(--hairline-2); border-radius:var(--radius-sm);
    box-shadow:var(--shadow-3);
  }

  /* leaflet chrome */
  #map{background:var(--bg-2);}
  .leaflet-control-zoom a{
    background:var(--glass) !important; color:var(--text) !important;
    border-color:var(--hairline) !important;
    backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur));
  }
  .leaflet-control-zoom a:hover{background:var(--surface-3) !important; color:var(--gold) !important;}
  .leaflet-bar{border:1px solid var(--hairline) !important; border-radius:var(--radius-sm) !important; overflow:hidden;}
  .leaflet-control-attribution{
    background:rgba(11,18,32,.75) !important; color:var(--text-3) !important;
    backdrop-filter:blur(8px); border-radius:6px 0 0 0;
  }
  .leaflet-control-attribution a{color:var(--text-2) !important;}
  .leaflet-popup-content-wrapper{
    background:var(--surface-2); color:var(--text);
    border:1px solid var(--hairline-2); border-radius:var(--radius);
    box-shadow:var(--shadow-3);
  }
  .leaflet-popup-tip{background:var(--surface-2); border:1px solid var(--hairline-2);}
  .leaflet-popup-close-button{color:var(--text-3) !important;}
  .map-popup .mp-title{color:var(--text);}
  .map-popup .mp-icon{color:var(--text-3);}
  .map-popup .mp-icon:hover{background:rgba(255,255,255,.08); color:var(--gold);}
  .map-popup .mp-table td{border-color:var(--hairline);}
  .map-popup .mp-table td:first-child{color:var(--text-3);}
  .map-popup .mp-table td:last-child{color:var(--text);}
  .map-popup .mp-empty{color:var(--text-3);}
  .map-popup .mp-pager{border-color:var(--hairline);}
  .map-popup .mp-arrow{border-color:var(--hairline); background:rgba(255,255,255,.04); color:var(--text-2);}
  .map-popup .mp-arrow:hover{border-color:var(--gold); color:var(--gold);}
  .map-popup .mp-count{color:var(--text-3);}

  /* motion */
  @keyframes kmFadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .map-tools, .map-legend, .map-files, .empty{animation:kmFadeUp .32s var(--ease) both;}
  .panel{transition:transform .28s var(--ease);}
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }

  /* responsive */
  @media (max-width: 900px){
    header{padding:10px 14px; gap:10px;}
    .toolbar{padding:8px 14px; gap:8px;}
    .map-panels{width:min(230px, 52%);}
  }
  @media (max-width: 620px){
    header h1 .tagline{display:none;}
    .search-wrap{min-width:140px;}
    .batchbar{padding:8px 12px; gap:6px;}
    .batchbar .btn{padding:7px 10px; font-size:12px;}
  }

  /* ================= KEYMAP application shell ================= */
  body{display:block; overflow:hidden;}
  .km-app{display:flex; height:100vh; width:100%; overflow:hidden;}

  /* ---- sidebar ---- */
  .km-sidebar{
    width:186px; flex-shrink:0;
    background:var(--surface); border-inline-end:1px solid var(--hairline);
    display:flex; flex-direction:column;
    transition:width .22s var(--ease);
  }
  .km-sidebar.collapsed{width:60px;}
  .km-brand{
    display:flex; align-items:center; gap:10px;
    padding:16px 14px; border-bottom:1px solid var(--hairline);
    min-height:62px;
  }
  .km-brand .km-mark{
    width:30px; height:30px; flex-shrink:0; border-radius:9px;
    background:linear-gradient(145deg, var(--gold-hi), var(--gold));
    display:grid; place-items:center; color:#141005;
  }
  .km-brand .km-mark svg{width:18px; height:18px;}
  .km-brand-text{display:flex; flex-direction:column; gap:1px; overflow:hidden;}
  .km-brand-text .brand{font-size:15px; font-weight:800; letter-spacing:2px; color:var(--text); white-space:nowrap;}
  .km-brand-text .brand em{font-style:normal; color:var(--gold);}
  .km-brand-text .tagline{
    font-size:7.5px; font-weight:600; letter-spacing:1.3px;
    text-transform:uppercase; color:var(--text-3); white-space:nowrap;
  }
  .km-sidebar.collapsed .km-brand-text{display:none;}

  .km-nav{flex:1; overflow-y:auto; padding:10px 8px; display:flex; flex-direction:column; gap:2px;}
  .km-nav button{
    display:flex; align-items:center; gap:11px;
    width:100%; padding:9px 11px;
    background:transparent; border:none; border-radius:var(--radius-sm);
    color:var(--text-3); font-family:var(--sans); font-size:12.5px; font-weight:500;
    cursor:pointer; text-align:start; white-space:nowrap;
    transition:background .16s var(--ease), color .16s var(--ease);
  }
  .km-nav button .ico svg{width:16px; height:16px;}
  .km-nav button:hover{background:rgba(255,255,255,.05); color:var(--text);}
  .km-nav button.active{background:var(--gold-dim); color:var(--gold);}
  .km-nav button .km-chev{margin-inline-start:auto; opacity:.5;}
  .km-nav button .km-chev svg{width:13px; height:13px;}
  .km-nav .km-count{
    margin-inline-start:auto; font-family:var(--mono); font-size:10px;
    color:var(--text-3); font-variant-numeric:tabular-nums;
  }
  .km-sidebar.collapsed .km-nav button > *:not(.ico){display:none;}
  .km-sidebar.collapsed .km-nav button{justify-content:center; padding:9px;}
  .km-collapse{
    border-top:1px solid var(--hairline); padding:9px 8px;
  }
  .km-collapse button{
    display:flex; align-items:center; gap:11px; width:100%; padding:8px 11px;
    background:transparent; border:none; border-radius:var(--radius-sm);
    color:var(--text-3); font-family:var(--sans); font-size:12px; cursor:pointer;
  }
  .km-collapse button:hover{background:rgba(255,255,255,.05); color:var(--text);}
  .km-sidebar.collapsed .km-collapse span:not(.ico){display:none;}

  /* ---- main column ---- */
  .km-main{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}

  .km-search{
    flex:1; max-width:520px; position:relative;
    display:flex; align-items:center;
  }
  .km-search .ico{
    position:absolute; inset-inline-start:12px; color:var(--text-3); pointer-events:none;
  }
  .km-search .ico svg{width:15px; height:15px;}
  .km-search input{
    width:100%; padding:9px 14px; padding-inline-start:36px; padding-inline-end:46px;
    background:rgba(255,255,255,.04); border:1px solid var(--hairline);
    border-radius:var(--radius-sm); color:var(--text);
    font-size:12.5px; font-family:var(--sans);
  }
  .km-search input:focus{
    outline:none; border-color:var(--gold); background:rgba(255,255,255,.07);
    box-shadow:0 0 0 3px var(--gold-dim);
  }
  .km-search kbd{
    position:absolute; inset-inline-end:10px;
    font-family:var(--mono); font-size:10px; color:var(--text-3);
    background:rgba(255,255,255,.06); border:1px solid var(--hairline);
    border-radius:4px; padding:2px 5px; pointer-events:none;
  }

  /* ---- KPI strip ---- */
  .km-kpis{
    display:grid; gap:10px; padding:12px 16px;
    grid-template-columns:repeat(auto-fit, minmax(148px, 1fr));
    border-bottom:1px solid var(--hairline); flex-shrink:0;
    background:var(--bg);
  }
  .km-kpi{
    background:var(--surface); border:1px solid var(--hairline);
    border-radius:var(--radius); padding:12px 14px;
    display:flex; align-items:center; gap:11px;
    transition:border-color .18s var(--ease), transform .18s var(--ease);
  }
  .km-kpi:hover{border-color:var(--hairline-2); transform:translateY(-1px);}
  .km-kpi-ico{
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    display:grid; place-items:center;
  }
  .km-kpi-ico svg{width:18px; height:18px;}
  .km-kpi-body{min-width:0; display:flex; flex-direction:column; gap:1px;}
  .km-kpi-label{font-size:10.5px; color:var(--text-3); font-weight:600; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .km-kpi-value{font-size:19px; font-weight:700; color:var(--text);
    font-variant-numeric:tabular-nums; line-height:1.15;}
  .km-kpi-sub{font-size:9.5px; color:var(--text-3);}

  /* ---- workspace: layers | map | inspector ---- */
  .km-workspace{flex:1; display:flex; min-height:0; overflow:hidden;}
  .km-rail{
    width:250px; flex-shrink:0; background:var(--surface);
    display:flex; flex-direction:column; gap:10px;
    padding:12px; overflow-y:auto;
  }
  .km-rail-left{border-inline-end:1px solid var(--hairline);}
  .km-rail-right{border-inline-start:1px solid var(--hairline); width:272px;}
  .km-rail.hidden{display:none;}
  .km-center{flex:1; min-width:0; display:flex; flex-direction:column; position:relative;}

  .km-card{
    background:rgba(255,255,255,.03); border:1px solid var(--hairline);
    border-radius:var(--radius); overflow:hidden; flex-shrink:0;
  }
  .km-card-head{
    display:flex; align-items:center; gap:8px;
    padding:9px 11px; border-bottom:1px solid var(--hairline);
  }
  .km-card-head h3{
    margin:0; font-size:11.5px; font-weight:700; color:var(--text); flex:1;
    display:flex; align-items:center; gap:7px;
  }
  .km-card-head h3 .ico svg{width:14px; height:14px; color:var(--gold);}
  .km-card-head button{
    background:rgba(255,255,255,.05); border:1px solid var(--hairline);
    color:var(--text-3); border-radius:5px; font-size:10px; font-weight:700;
    padding:3px 8px; cursor:pointer; font-family:var(--sans);
  }
  .km-card-head button:hover{background:var(--gold-dim); border-color:var(--gold); color:var(--gold);}
  .km-card-body{padding:8px; max-height:230px; overflow-y:auto;}
  .km-card-body.tight{padding:6px;}

  /* map draw toolbar, centred over the canvas like the mockup */
  .km-drawbar{
    position:absolute; top:12px; left:50%; transform:translateX(-50%);
    z-index:420; display:flex; gap:3px; padding:5px;
    background:var(--glass); backdrop-filter:blur(var(--blur)) saturate(1.25);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(1.25);
    border:1px solid var(--hairline); border-radius:var(--radius);
    box-shadow:var(--shadow-2);
  }
  .km-drawbar button{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    min-width:52px; padding:7px 6px; border:none; background:transparent;
    color:var(--text-3); border-radius:8px; cursor:pointer;
    font-family:var(--sans); font-size:9.5px; font-weight:600;
    transition:background .16s var(--ease), color .16s var(--ease);
  }
  .km-drawbar button .ico svg{width:17px; height:17px;}
  .km-drawbar button:hover{background:rgba(255,255,255,.07); color:var(--text);}
  .km-drawbar button.active{background:var(--gold); color:#141005;}

  /* right-edge map controls: compass, 3D, locate */
  .km-mapctl{
    position:absolute; top:12px; inset-inline-end:12px; z-index:420;
    display:flex; flex-direction:column; gap:6px;
  }
  .km-mapctl button{
    width:34px; height:34px; display:grid; place-items:center;
    background:var(--glass); backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    border:1px solid var(--hairline); border-radius:9px;
    color:var(--text-2); cursor:pointer; font-family:var(--sans);
    font-size:10.5px; font-weight:700;
    transition:background .16s var(--ease), color .16s var(--ease);
  }
  .km-mapctl button:hover{background:var(--surface-3); color:var(--gold);}
  .km-mapctl button svg{width:17px; height:17px;}
  .km-compass svg{transition:transform .3s var(--ease);}

  /* feature inspector */
  .km-feat-empty{padding:16px 12px; text-align:center; color:var(--text-3); font-size:11.5px; line-height:1.7;}
  .km-feat-title{font-size:13px; font-weight:700; color:var(--text); margin-bottom:2px;}
  .km-feat-badge{
    display:inline-flex; align-items:center; gap:4px;
    background:var(--ok-soft); color:var(--ok);
    font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:99px;
  }
  .km-feat-badge.del{background:var(--danger-soft); color:var(--danger);}
  .km-feat-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:9px;
  }
  .km-feat-cell{
    background:rgba(255,255,255,.04); border:1px solid var(--hairline);
    border-radius:8px; padding:7px 9px; min-width:0;
  }
  .km-feat-cell .k{font-size:9px; color:var(--text-3); font-weight:600;
    text-transform:uppercase; letter-spacing:.4px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .km-feat-cell .v{font-size:12px; color:var(--text); font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .km-feat-actions{display:flex; gap:6px; margin-top:9px;}
  .km-feat-actions button{flex:1; padding:7px 4px; font-size:11px;}

  /* AI console */
  .km-ai{border-top:1px solid var(--hairline); padding:10px; background:rgba(200,155,60,.04);}
  .km-ai-head{
    display:flex; align-items:center; gap:7px; margin-bottom:8px;
    font-size:11px; font-weight:700; color:var(--text);
  }
  .km-ai-head .ico svg{width:14px; height:14px; color:var(--gold);}
  .km-ai-tag{
    font-size:8.5px; font-weight:800; letter-spacing:.6px;
    background:var(--gold-dim); color:var(--gold);
    padding:2px 6px; border-radius:4px;
  }
  .km-ai-input{position:relative; display:flex; align-items:center;}
  .km-ai-input input{
    width:100%; padding:9px 12px; padding-inline-end:38px;
    background:rgba(255,255,255,.05); border:1px solid var(--hairline);
    border-radius:var(--radius-sm); color:var(--text);
    font-size:11.5px; font-family:var(--sans);
  }
  .km-ai-input input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-dim);}
  .km-ai-send{
    position:absolute; inset-inline-end:5px;
    width:26px; height:26px; display:grid; place-items:center;
    background:var(--gold); color:#141005; border:none; border-radius:6px; cursor:pointer;
  }
  .km-ai-send svg{width:14px; height:14px;}
  .km-ai-chips{display:flex; gap:5px; margin-top:7px; flex-wrap:wrap;}
  .km-ai-chips button{
    background:rgba(255,255,255,.05); border:1px solid var(--hairline);
    color:var(--text-2); border-radius:99px; font-size:10px; font-weight:600;
    padding:4px 10px; cursor:pointer; font-family:var(--sans);
  }
  .km-ai-chips button:hover{background:var(--gold-dim); border-color:var(--gold); color:var(--gold);}
  .km-ai-out{
    margin-top:8px; font-size:11px; line-height:1.75; color:var(--text-2);
    background:rgba(0,0,0,.25); border:1px solid var(--hairline);
    border-radius:var(--radius-sm); padding:9px 10px; max-height:150px; overflow-y:auto;
  }
  .km-ai-out:empty{display:none;}
  .km-ai-out b{color:var(--text);}
  .km-ai-out .warn{color:var(--gold-hi);}

  /* the old floating panels now live in the rails */
  .km-rail .map-legend, .km-rail .map-files{
    position:static; background:transparent; border:none; box-shadow:none;
    backdrop-filter:none; -webkit-backdrop-filter:none;
    max-height:none; padding:0; animation:none; width:auto;
  }
  .km-rail .lg-head-row{padding-bottom:0; border:none; margin-bottom:2px;}

  @media (max-width:1180px){
    .km-rail-right{display:none;}
  }
  @media (max-width:900px){
    .km-sidebar{width:60px;}
    .km-sidebar .km-brand-text, .km-sidebar .km-nav button > *:not(.ico),
    .km-sidebar .km-collapse span:not(.ico){display:none;}
    .km-sidebar .km-nav button{justify-content:center; padding:9px;}
    .km-rail-left{display:none;}
    .km-kpis{grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); padding:9px 12px;}
  }

  /* ---- geo tools ---- */
  .km-meas-hud{
    position:absolute; bottom:74px; inset-inline-start:12px; z-index:430;
    display:none; min-width:180px; padding:10px 12px;
    background:var(--glass); backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    border:1px solid var(--gold); border-radius:var(--radius);
    box-shadow:var(--shadow-2); color:var(--text); font-size:11.5px; line-height:1.8;
    font-variant-numeric:tabular-nums;
  }
  .km-meas-hud.show{display:block;}
  .km-meas-hud b{color:var(--gold);}
  .km-meas-hud button{
    flex:1; background:rgba(255,255,255,.06); border:1px solid var(--hairline);
    color:var(--text-2); border-radius:6px; font-size:10.5px; padding:4px 8px;
    cursor:pointer; font-family:var(--sans);
  }
  .km-meas-hud button:hover{border-color:var(--gold); color:var(--gold);}
  .km-mini{
    position:absolute; bottom:12px; inset-inline-end:12px; z-index:410;
    width:180px; height:130px; display:none;
    border:1px solid var(--hairline); border-radius:var(--radius);
    overflow:hidden; box-shadow:var(--shadow-2);
  }
  .km-mini > div{width:100%; height:100%; background:var(--bg-2);}
  .km-label{
    background:rgba(11,18,32,.82) !important; border:1px solid var(--hairline) !important;
    color:var(--text) !important; font-family:var(--sans); font-size:10px; font-weight:600;
    box-shadow:none !important; border-radius:5px; padding:1px 5px;
  }
  .km-label::before{display:none !important;}
  .km-cluster span{
    display:grid; place-items:center; border-radius:99px;
    background:rgba(200,155,60,.9); color:#141005;
    font-family:var(--sans); font-weight:800; font-size:11px;
    border:2px solid rgba(11,18,32,.75); box-shadow:var(--shadow-1);
  }

  /* ---- refined brand mark ---- */
  .km-mark{
    width:32px; height:32px; flex-shrink:0; border-radius:9px;
    background:linear-gradient(155deg, var(--gold-hi) 0%, var(--gold) 55%, #9c7a2e 100%);
    display:grid; place-items:center; color:#141005;
    box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 2px 6px rgba(0,0,0,.35);
    position:relative; overflow:hidden;
  }
  .km-mark::after{
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:linear-gradient(155deg, rgba(255,255,255,.35), transparent 45%);
    pointer-events:none;
  }
  .km-mark svg{width:19px; height:19px; position:relative; z-index:1;}

  /* ---- collapsible cards ---- */
  .km-card-head{cursor:pointer; user-select:none;}
  .km-card-collapse{
    background:transparent !important; border:none !important;
    color:var(--text-3) !important; padding:2px !important;
    display:flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:5px; flex-shrink:0;
    transition:transform .2s var(--ease), color .16s var(--ease), background .16s var(--ease);
  }
  .km-card-collapse:hover{background:rgba(255,255,255,.08) !important; color:var(--text) !important;}
  .km-card-collapse svg{width:14px; height:14px;}
  .km-card.collapsed .km-card-collapse{transform:rotate(-90deg);}
  [dir=rtl] .km-card.collapsed .km-card-collapse{transform:rotate(90deg);}
  .km-card.collapsed .km-card-body{display:none;}
  .km-card.collapsed{flex-shrink:0;}
  .km-ai-head{cursor:pointer; user-select:none;}
  .km-card.collapsed .km-ai-input,
  .km-card.collapsed .km-ai-chips,
  .km-card.collapsed .km-ai-out{display:none;}

  /* ---- panel visibility: hidden panels are removed from layout entirely ---- */
  .km-panel-off{display:none !important;}

  /* ---- Panels (view) menu ---- */
  .km-panels-wrap{position:relative;}
  .km-panels-pop{
    display:none;
    position:absolute; top:calc(100% + 8px); inset-inline-end:0;
    width:252px; z-index:1300;
    background:var(--surface-2); border:1px solid var(--hairline-2);
    border-radius:var(--radius); box-shadow:var(--shadow-3);
    padding:8px;
  }
  .km-panels-pop.open{display:block;}
  .km-panels-head{
    font-size:10.5px; font-weight:700; color:var(--text-3);
    text-transform:uppercase; letter-spacing:.5px;
    padding:4px 6px 8px; border-bottom:1px solid var(--hairline); margin-bottom:4px;
  }
  .km-panel-row{
    display:flex; align-items:center; gap:9px;
    padding:7px 6px; border-radius:7px; cursor:pointer;
  }
  .km-panel-row:hover{background:rgba(255,255,255,.05);}
  .km-panel-row .ico{color:var(--text-3); flex-shrink:0;}
  .km-panel-row .ico svg{width:15px; height:15px;}
  .km-panel-row span.lbl{flex:1; font-size:12px; color:var(--text-2);}
  .km-panel-row input[type=checkbox]{accent-color:var(--gold); width:15px; height:15px;}
  .km-panels-foot{
    border-top:1px solid var(--hairline); margin-top:6px; padding-top:6px;
    display:flex; gap:6px;
  }
  .km-panels-foot button{
    flex:1; background:rgba(255,255,255,.05); border:1px solid var(--hairline);
    color:var(--text-2); border-radius:6px; font-size:10.5px; font-weight:600;
    padding:6px; cursor:pointer; font-family:var(--sans);
  }
  .km-panels-foot button:hover{border-color:var(--gold); color:var(--gold); background:var(--gold-dim);}

  /* small dismiss (x) buttons on the floating map toolbars, so they can be
     closed with one click without opening the Panels menu */
  .map-tools.km-dismissable{padding-inline-end:4px;}
  .km-dismiss{
    border:none; background:transparent; color:var(--text-3);
    width:20px; height:20px; display:flex; align-items:center; justify-content:center;
    border-radius:6px; cursor:pointer; margin-inline-start:1px; align-self:center;
  }
  .km-dismiss:hover{background:rgba(255,255,255,.08); color:var(--danger);}
  .km-dismiss svg{width:12px; height:12px;}

  /* a slim restore handle appears at the map edge when draw tools are hidden */
  .km-restore-tab{
    position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:415;
    display:none; align-items:center; gap:5px;
    background:var(--glass); backdrop-filter:blur(var(--blur));
    -webkit-backdrop-filter:blur(var(--blur));
    border:1px solid var(--hairline); border-radius:99px;
    padding:6px 11px; cursor:pointer; color:var(--text-2);
    font-family:var(--sans); font-size:10.5px; font-weight:600;
  }
  .km-restore-tab:hover{border-color:var(--gold); color:var(--gold);}
  .km-restore-tab svg{width:13px; height:13px;}
  .km-restore-tab.show{display:flex;}
</style>
</head>
<body>

<div class="km-app">
  <aside class="km-sidebar" id="kmSidebar">
    <div class="km-brand">
      <span class="km-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2.2c-4.42 0-8 3.5-8 7.85 0 5.8 8 11.75 8 11.75s8-5.95 8-11.75c0-4.35-3.58-7.85-8-7.85z" fill="currentColor"/>
          <path d="M7.6 8.4h8.8M8.5 11h6.9M9.4 13.6h5.2" stroke="#141005" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="km-brand-text">
        <span class="brand">KEY<em>MAP</em></span>
        <span class="tagline" data-i18n="tagline"></span>
      </span>
    </div>
    <nav class="km-nav" id="kmNav">
      <button id="navDashboard" data-nav="dashboard" data-icon="layoutGrid"><span data-i18n="nav_dashboard"></span><span class="km-count" id="navDashboardCount"></span></button>
      <button id="navMap" data-nav="map" data-icon="map" class="active"<span data-i18n="nav_map"></span><span class="km-count" id="navMapCount"></span></button>
      <button id="navLayers" data-nav="layers" data-icon="layers"><span data-i18n="nav_layers"></span><span class="km-count" id="navLayersCount"></span></button>
      <button id="navTable" data-nav="table" data-icon="table"><span data-i18n="nav_table"></span><span class="km-count" id="navTableCount"></span></button>
      <button id="navSelection" data-nav="selection" data-icon="pointer"><span data-i18n="nav_selection"></span><span class="km-count" id="navSelectionCount"></span></button>
      <button id="navToolbox" data-nav="toolbox" data-icon="toolbox"><span data-i18n="nav_toolbox"></span><span class="km-count" id="navToolboxCount"></span></button>
      <button id="navStats" data-nav="stats" data-icon="stats"><span data-i18n="nav_stats"></span><span class="km-count" id="navStatsCount"></span></button>
      <button id="navSettings" data-nav="settings" data-icon="settings"><span data-i18n="nav_settings"></span><span class="km-count" id="navSettingsCount"></span></button>
    </nav>
    <div class="km-collapse">
      <button id="kmCollapseBtn" data-icon="chevrons"><span data-i18n="collapse"></span></button>
    </div>
  </aside>

  <div class="km-main">
    <header>
      <div class="km-header-actions" id="kmHeaderActions">
      <div class="km-search">
        <span class="ico" data-noicon></span>
        <input type="text" id="globalSearch" data-i18n-ph="globalSearchPh">
        <kbd>Ctrl K</kbd>
      </div>


  <label class="file-label" id="loadLabel" data-icon="upload"><span data-i18n="loadKmz"></span><input type="file" id="fileInput" accept=".kmz" multiple></label>
  <div class="files-wrap">
    <button class="btn btn-ghost" id="filesBtn" data-icon="folder" style="display:none;"></button>
    <div class="files-pop" id="filesPop">
      <div class="fp-head" data-i18n="filesHead"></div>
      <div id="filesList"></div>
      <button class="mini-btn" id="mergeSourcesBtn" data-icon="merge" style="width:100%; margin-top:8px;" data-i18n="mergeBtn" data-i18n-title="mergeBtnTip"></button>
      <div class="fp-note" data-i18n="filesNote"></div>
    </div>
  </div>
  <div class="spacer"></div>
  <button class="btn btn-ghost btn-icon" id="undoBtn" data-icon="undo" disabled>↶</button>
  <button class="btn btn-ghost btn-icon" id="redoBtn" data-icon="redo" disabled>↷</button>
  <button class="btn btn-gold" id="saveBtn" data-icon="save" style="display:none;"></button>
  <button class="btn btn-ghost" id="resetBtn" data-icon="reset" data-i18n="resetAll" disabled></button>
  <button class="btn btn-gold" id="exportBtn" data-icon="download" data-i18n="exportKmz" disabled></button>
      </div>
      <div class="km-header-end">
        <div class="km-panels-wrap">
          <button class="btn btn-ghost btn-icon" id="panelsMenuBtn" data-icon="viewToggle" data-i18n-title="panelsMenuTip"></button>
          <div class="km-panels-pop" id="kmPanelsPop">
            <div class="km-panels-head" data-i18n="panelsMenuHead"></div>
            <div id="kmPanelsList"></div>
            <div class="km-panels-foot">
              <button id="kmPanelsShowAll" data-i18n="showAll"></button>
              <button id="kmPanelsReset" data-i18n="panelsReset"></button>
            </div>
          </div>
        </div>
        <button class="btn btn-ghost" id="langBtn" data-icon="globe" title="Switch language / تبديل اللغة">EN</button>
      </div>
    </header>

    <div class="km-kpis" id="kmKpis"></div>

    <div class="km-workspace">
      <aside class="km-rail km-rail-left" id="kmRailLeft">
        <div class="km-card" data-card-id="layers">
          <div class="km-card-head" data-card-toggle>
            <h3><span class="ico" data-icon-inline="layers"></span><span data-i18n="panelLayers"></span></h3>
            <button data-vis="all" data-files-bulk data-i18n="showAll"></button>
            <button data-vis="none" data-files-bulk data-i18n="hideAll"></button>
            <button class="km-card-collapse" data-icon-inline="chevronDown"></button>
          </div>
          <div class="km-card-body tight" id="kmFilesHost"></div>
        </div>

  const DEFAULT_FILL = {hex:'#BA9863', alpha:0.45};
  const DEFAULT_LINE = {hex:'#3D3936', alpha:1};

  // ---------- KML colour (aabbggrr) -> CSS ----------
  function kmlColorToCss(kmlColor){
    if(!kmlColor || kmlColor.length < 8) return DEFAULT_FILL;
    const aa = kmlColor.slice(0,2), bb = kmlColor.slice(2,4), gg = kmlColor.slice(4,6), rr = kmlColor.slice(6,8);
    const alpha = parseInt(aa,16)/255;
    const hex = '#'+rr+gg+bb;
    return {hex, alpha: isNaN(alpha)?1:alpha};
  }

  function buildStyleColorMap(){
    styleColorMap = {};
    const styles = Array.from(xmlDoc.getElementsByTagName('Style'));
    styles.forEach(s=>{
      const id = s.getAttribute('id');
      if(!id) return;
      const polyColorEl = s.getElementsByTagName('PolyStyle')[0];
      const lineColorEl = s.getElementsByTagName('LineStyle')[0];
      const pc = polyColorEl ? polyColorEl.getElementsByTagName('color')[0] : null;
      const lc = lineColorEl ? lineColorEl.getElementsByTagName('color')[0] : null;
      styleColorMap[id] = {
        fill: pc ? kmlColorToCss(pc.textContent.trim()) : DEFAULT_FILL,
        line: lc ? kmlColorToCss(lc.textContent.trim()) : DEFAULT_LINE
      };
    });
  }

  // ---------- Geometry extraction (Polygon / MultiGeometry, with holes) ----------
  function parseCoordText(text){
    return text.trim().split(/\s+/).filter(Boolean).map(tok=>{
      const parts = tok.split(',');
      const lon = parseFloat(parts[0]), lat = parseFloat(parts[1]);
      return [lat, lon];
    });
  }

  function extractRings(placemarkNode){
    const polys = Array.from(placemarkNode.getElementsByTagName('Polygon'));
    if(polys.length === 0) return null;
    const parts = polys.map(poly=>{
      const outerWrap = poly.getElementsByTagName('outerBoundaryIs')[0];
      const outerCoordEl = outerWrap ? outerWrap.getElementsByTagName('coordinates')[0] : null;
      if(!outerCoordEl) return null;
      const outer = parseCoordText(outerCoordEl.textContent);
      const innerWraps = Array.from(poly.getElementsByTagName('innerBoundaryIs'));
      const holes = innerWraps.map(w=>{
        const c = w.getElementsByTagName('coordinates')[0];
        return c ? parseCoordText(c.textContent) : [];
      }).filter(h=>h.length>0);
      return [outer, ...holes];
    }).filter(Boolean);
    return parts.length ? parts : null;
  }

  function escapeHtml(s){

  // ---------- Parse an inner HTML-table description into key/value rows ----------
  function parseDescriptionRows(rawHtml){
    if(!rawHtml) return {title:'', rows:[]};
    const doc = new DOMParser().parseFromString(rawHtml, 'text/html');
    const trs = doc.querySelectorAll('tr');
    let title = '';
    const rows = [];
    trs.forEach(tr=>{
      const tds = tr.querySelectorAll('td');
      if(tds.length === 1 && !title){
        title = tds[0].textContent.trim();
      } else if(tds.length === 2){
        rows.push({key: tds[0].textContent.trim(), val: tds[1].textContent.trim()});
      }
    });
    return {title, rows};
  }

  function buildDescriptionHtml(title, rows){
    let inner = '';
    rows.forEach((r,i)=>{
      const bg = (i % 2 === 1) ? ' bgcolor="#D4E4F3"' : '';
      inner += `<tr${bg}><td>${escapeHtml(r.key)}</td><td>${escapeHtml(r.val)}</td></tr>\n`;
    });
    return `<html xmlns:fo="http://www.w3.org/1999/XSL/Format" xmlns:msxsl="urn:schemas-microsoft-com:xslt">
<head>
<META http-equiv="Content-Type" content="text/html">
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>
<body style="margin:0px 0px 0px 0px;overflow:auto;background:#FFFFFF;">
<table style="font-family:Arial,Verdana,Times;font-size:12px;text-align:left;width:100%;border-collapse:collapse;padding:3px 3px 3px 3px">
<tr style="text-align:center;font-weight:bold;background:#9CBCE2">
<td>${escapeHtml(title)}</td>
</tr>
<tr>
<td>
<table style="font-family:Arial,Verdana,Times;font-size:12px;text-align:left;width:100%;border-spacing:0px; padding:3px 3px 3px 3px">
${inner}</table>
</td>
</tr>
</table>
</body></html>`;
  }

  // ---------- Load / merge KMZ files ----------
  async function readKmlFromKmz(file){
    const zip = await JSZip.loadAsync(file);
    let kmlEntry = null;
    zip.forEach((path, entry)=>{ if(/\.kml$/i.test(path) && !kmlEntry) kmlEntry = entry; });
    if(!kmlEntry) throw new Error(t('noKml'));
    const kmlText = await kmlEntry.async('string');
    const doc = new DOMParser().parseFromString(kmlText, 'text/xml');
    if(doc.querySelector('parsererror')) throw new Error(t('badXml'));
    return doc;
  }

  // Two files can easily share style ids ("s1", "poly0"...). Namespace the
  // incoming document's ids so merged plots keep their own colours.
  function prefixStyleIds(doc, prefix){
    const renamed = {};
    ['Style','StyleMap'].forEach(tag=>{
      Array.from(doc.getElementsByTagName(tag)).forEach(el=>{
        const id = el.getAttribute('id');
        if(!id) return;
        renamed[id] = prefix + id;
        el.setAttribute('id', prefix + id);
      });
    });
    Array.from(doc.getElementsByTagName('styleUrl')).forEach(su=>{
      const v = su.textContent.trim();
      if(!v.startsWith('#')) return;              // leave external references alone
      const bare = v.slice(1);
      if(renamed[bare]) su.textContent = '#' + renamed[bare];
    });
    return renamed;
  }

  function docContainer(doc){
    return doc.getElementsByTagName('Document')[0] || doc.documentElement;
  }

  // Pull one parsed document into the master doc; returns the new Placemark nodes.
  function mergeIntoMaster(doc, fileName, sourceId){
    prefixStyleIds(doc, 'f' + sourceId + '_');
    const master = docContainer(xmlDoc);
    // createElementNS keeps the KML default namespace — createElement would emit xmlns=""
    const ns = xmlDoc.documentElement.namespaceURI;
    const folder = ns ? xmlDoc.createElementNS(ns, 'Folder') : xmlDoc.createElement('Folder');
    const fname = ns ? xmlDoc.createElementNS(ns, 'name') : xmlDoc.createElement('name');
    fname.textContent = fileName;
    folder.appendChild(fname);

    // styles first, at document level, so every placemark can resolve them
    Array.from(doc.getElementsByTagName('Style'))
      .concat(Array.from(doc.getElementsByTagName('StyleMap')))
      .filter(el=> el.getAttribute('id'))
      .forEach(el=> master.appendChild(xmlDoc.importNode(el, true)));

    const added = [];
    Array.from(doc.getElementsByTagName('Placemark')).forEach(pmNode=>{
      const imported = xmlDoc.importNode(pmNode, true);
      folder.appendChild(imported);
      added.push(imported);
    });
    master.appendChild(folder);
    return {nodes: added, folder};
  }

  function buildPlacemark(node, source){
    const nameEl = node.getElementsByTagName('name')[0];
    const descEl = node.getElementsByTagName('description')[0];
    const styleUrlEl = node.getElementsByTagName('styleUrl')[0];
    const parsed = parseDescriptionRows(descEl ? descEl.textContent : '');
    const idx = nextIdx++;
    return {
      idx,
      node,
      nameEl,
      descEl,
      sourceId: source.id,
      sourceName: source.name,
      styleId: styleUrlEl ? styleUrlEl.textContent.trim().replace(/^#/,'') : null,
      rings: extractRings(node),
      name: nameEl ? nameEl.textContent.trim() : t('unnamed', {n: idx}),
      title: parsed.title,
      fields: parsed.rows,
      deleted: false,
      dirty: false
    };
  }

  fileInput.addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    let addedTotal = 0, addedFiles = 0;
    for(const file of files){
      try{
        const doc = await readKmlFromKmz(file);
        const source = {id: sources.length, name: file.name.replace(/\.kmz$/i,'')};
        let nodes;
        if(!xmlDoc){
          xmlDoc = doc;                       // first file becomes the master document
          originalFileName = source.name;
          nodes = Array.from(xmlDoc.getElementsByTagName('Placemark'));
          source.folder = null;
        } else {
          const merged = mergeIntoMaster(doc, source.name, source.id);
          nodes = merged.nodes;
          source.folder = merged.folder;
        }
        sources.push(source);
        const fresh = nodes.map(n=> buildPlacemark(n, source))
                           .filter(pm => pm.fields.length > 0 || pm.name);
        source.count = fresh.length;
        placemarks = placemarks.concat(fresh);
        addedTotal += fresh.length;
        addedFiles++;
      }catch(err){
        console.error(err);
        showToast(t('fileError', {file: file.name, msg: err.message}));
      }
    }
    fileInput.value = '';                     // allow re-picking the same file later
    if(!addedFiles) return;
    refreshAfterSourceChange();
    markSession();
    showToast(sources.length > 1
      ? t('mergedInfo', {n: addedTotal, files: addedFiles, total: placemarks.length})
      : t('loaded', {n: addedTotal}));
  });
