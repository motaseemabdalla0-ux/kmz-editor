    removeSource(source);
  });

  // Combine every currently-visible file into one file, so the export carries a
  // single merged layer instead of one folder per source.
  function mergeVisibleSources(){
    const vis = sources.filter(s=> s.visible !== false);
    if(vis.length < 2){ showToast(t('mergeNeedsTwo')); return; }
    const suggested = vis[0].name + '_merged';
    const name = prompt(t('mergePrompt', {n: vis.length}), suggested);
    if(name === null) return;
    const finalName = (name.trim() || suggested);

    const ns = xmlDoc.documentElement.namespaceURI;
    const folder = ns ? xmlDoc.createElementNS(ns, 'Folder') : xmlDoc.createElement('Folder');
    const fname = ns ? xmlDoc.createElementNS(ns, 'name') : xmlDoc.createElement('name');
    fname.textContent = finalName;
    folder.appendChild(fname);

    const target = {
      id: sources.reduce((m, s)=> Math.max(m, s.id), -1) + 1,
      name: finalName, visible: true, folder
    };
    let moved = 0;
    placemarks.forEach(p=>{
      if(!vis.some(s=> s.id === p.sourceId)) return;
      folder.appendChild(p.node);          // appending an existing node moves it
      p.sourceId = target.id;
      p.sourceName = finalName;
      moved++;
    });
    docContainer(xmlDoc).appendChild(folder);
    // drop the now-empty folders of the sources we absorbed
    vis.forEach(s=>{ if(s.folder && s.folder.parentNode) s.folder.parentNode.removeChild(s.folder); });
    sources = sources.filter(s=> !vis.some(v=> v.id === s.id));
    sources.push(target);
    if(sources.length === 1) originalFileName = finalName;

    refreshAfterSourceChange();
    markSession();
    showToast(t('mergedInto', {n: moved, name: finalName}));
  }

  function removeSource(source){
    const mine = placemarks.filter(p=>p.sourceId === source.id);
    mine.forEach(p=>{
      if(p.node && p.node.parentNode) p.node.parentNode.removeChild(p.node);
      selected.delete(p.idx);
      const layer = mapLayers[p.idx];
      if(layer && mapLayerGroup){ mapLayerGroup.removeLayer(layer); }
      delete mapLayers[p.idx];
    });
    if(source.folder && source.folder.parentNode) source.folder.parentNode.removeChild(source.folder);
    placemarks = placemarks.filter(p=>p.sourceId !== source.id);
    sources = sources.filter(s=>s.id !== source.id);
    if(!placemarks.length){ clearWorkspace(); showToast(t('allRemoved')); return; }
    refreshAfterSourceChange();
    markSession();
    showToast(t('removedSource', {name: source.name, n: mine.length}));
  }

  // ---------- Map ----------
  // AlUla old town — the fixed view the tool always opens on
  const ALULA_VIEW = {center:[26.6084, 37.9216], zoom:12};

  function ensureMap(){
    if(leafletMap) return leafletMap;
    leafletMap = L.map('map', {zoomControl:true, boxZoom:false, preferCanvas:true})
                  .setView(ALULA_VIEW.center, ALULA_VIEW.zoom);
    buildBasemaps();
    applyBasemap(baseKey, true);
    mapLayerGroup = L.layerGroup().addTo(leafletMap);
    enableMapSelectTools(leafletMap);   // shift+drag / lasso / brush replace Leaflet's box-zoom
    setTimeout(()=> leafletMap.invalidateSize(), 60);
    return leafletMap;
  }

  function initMap(){
    const fresh = !leafletMap;
    ensureMap();
    if(!fresh){
      mapLayerGroup.clearLayers();
      Object.keys(mapLayers).forEach(k=>delete mapLayers[k]);
    }

    const bounds = [];
    placemarks.forEach(pm=>{
      if(!pm.rings) return;
      const style = styleColorMap[pm.styleId] || {fill:DEFAULT_FILL, line:DEFAULT_LINE};
      const layer = L.polygon(pm.rings, {
        color: style.line.hex,
        weight: 1,
        opacity: style.line.alpha,
        fillColor: style.fill.hex,
        fillOpacity: style.fill.alpha
      });
      layer.on('click', (ev)=>{
        const oe = ev.originalEvent;
        if(Date.now() - boxSelectEndedAt < 300) return;
        if(selectMode || (oe && (oe.ctrlKey || oe.metaKey))){
          if(oe) L.DomEvent.stop(oe);
          leafletMap.closePopup();  // showQuickPopup opens a map-level popup now, not a layer-bound one
          const on = setSelected(pm);
          renderTable();
          showToast(on ? t('selectedOne', {name: pm.name}) : t('deselectedOne', {name: pm.name}));
          return;
        }
        if(kmShellReady) showFeature(pm);
        showQuickPopup(pm, layer, ev.latlng);
      });
      layer.addTo(mapLayerGroup);
      mapLayers[pm.idx] = layer;
      pm.rings.forEach(part=> part.forEach(ring=> ring.forEach(pt=> bounds.push(pt))));
    });

    // Defer the fit: if the map container is still hidden it has zero size, and
    // fitBounds would snap to max zoom with every plot collapsed onto one point.
    pendingFit = bounds.length ? bounds : null;
    fitMapIfVisible();
  }

  function fitMapIfVisible(){
    if(!leafletMap || !pendingFit) return;
    if(currentView !== 'map' || !mapWrap.offsetParent) return;
    leafletMap.invalidateSize();
    leafletMap.fitBounds(pendingFit, {padding:[20,20]});
    pendingFit = null;
  }

  // ---------- Basemaps (streets / satellite / hybrid) ----------
  const OSM_URL  = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
  const ESRI_IMG = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
  const ESRI_REF = 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}';
  const ESRI_ATTR = 'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community';

  // Tiles can fail when offline, behind a proxy, or on a host that blocks
  // external requests. Say so instead of leaving a blank map.
  function watchTiles(layer){
    const layers = layer.eachLayer ? [] : [layer];
    if(layer.eachLayer) layer.eachLayer(l=> layers.push(l));
    layers.forEach(l=> l.on('tileerror', ()=>{
      tileErrors++;
      if(tileErrors > 4 && !mapWrap.classList.contains('tiles-down')){
        mapWrap.classList.add('tiles-down');
        offlineNote.textContent = t('tilesBlocked');
      }
    }));
  }

  function buildBasemaps(){
    basemaps = {
      streets: L.tileLayer(OSM_URL, {
        maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
      }),
      satellite: L.tileLayer(ESRI_IMG, {
        maxZoom:21, maxNativeZoom:19, attribution: ESRI_ATTR
      }),
      // imagery with road/place labels drawn on top
      hybrid: L.layerGroup([
        L.tileLayer(ESRI_IMG, {maxZoom:21, maxNativeZoom:19, attribution: ESRI_ATTR}),
        L.tileLayer(ESRI_REF, {maxZoom:21, maxNativeZoom:19})
      ])
    };
  }

  function applyBasemap(key, skipRemove){
    if(!basemaps[key]) key = 'streets';
    if(!skipRemove && basemaps[baseKey]) leafletMap.removeLayer(basemaps[baseKey]);
    baseKey = key;
    tileErrors = 0;
    mapWrap.classList.remove('tiles-down');   // give the new source a fair chance
    watchTiles(basemaps[key]);
    basemaps[key].addTo(leafletMap);
    if(basemaps[key].bringToBack) basemaps[key].bringToBack();
    else basemaps[key].eachLayer(l=> l.bringToBack && l.bringToBack());
    Array.from(mapBasemaps.querySelectorAll('button')).forEach(b=>
      b.classList.toggle('active', b.dataset.base === key));
    try{ localStorage.setItem('kmzEditorBasemap', key); }catch(e){}
  }

  mapBasemaps.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-base]');
    if(!btn || !leafletMap) return;
    if(btn.dataset.base === baseKey) return;
    applyBasemap(btn.dataset.base);
  });

  function syncFillButtons(){
    const active = effectiveFill();
    Array.from(mapFillMode.querySelectorAll('button')).forEach(b=>
      b.classList.toggle('active', b.dataset.fill === active));
  }

  mapFillMode.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-fill]');
    if(!btn) return;
    fillMode = btn.dataset.fill;           // an explicit pick stops following the basemap
    try{ localStorage.setItem('kmzEditorFill', fillMode); }catch(err){}
    syncFillButtons();
    refreshAllMapVisuals();
    showToast(fillMode === 'outline' ? t('fillOutlineOn') : t('fillFilledOn'));
  });

  // ---------- Geometry helpers for lasso / brush hit-testing ----------
  // ray casting on [lat,lng] rings; lng is x, lat is y
  function pointInRing(lat, lng, ring){
    let inside = false;
    for(let i = 0, j = ring.length - 1; i < ring.length; j = i++){
      const yi = ring[i][0], xi = ring[i][1];
      const yj = ring[j][0], xj = ring[j][1];
      if(((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }

  // a placemark can be several polygon parts, each with holes
  function pointInPlacemark(pm, lat, lng){
    if(!pm.rings) return false;
    return pm.rings.some(part=>{
      if(!pointInRing(lat, lng, part[0])) return false;
      for(let h = 1; h < part.length; h++){
        if(pointInRing(lat, lng, part[h])) return false;   // fell into a hole
      }
      return true;
    });
  }

  // does a plot fall inside a freehand lasso ring?
  function placemarkInLasso(pm, lassoRing, lassoBounds){
    const layer = mapLayers[pm.idx];
    if(!layer || !lassoBounds.intersects(layer.getBounds())) return false;
    // any vertex of the plot inside the lasso...
    for(const part of pm.rings){
      for(const pt of part[0]){
        if(pointInRing(pt[0], pt[1], lassoRing)) return true;
      }
    }
    // ...or a lasso drawn entirely inside one big plot
    return pointInPlacemark(pm, lassoRing[0][0], lassoRing[0][1]);
  }

  function selectableTargets(){
    // bulk tools never touch rows the current search has filtered out
    return placemarks.filter(pm=> mapLayers[pm.idx] && matchesSearch(pm));
  }

  function announceDrag(changed, additive){
    showToast(changed
      ? (additive ? t('selectedN', {n: changed}) : t('deselectedN', {n: changed}))
      : t('noneInArea'));
  }

  // ---------- Map selection tools: rectangle / lasso / brush ----------
  function enableMapSelectTools(map){
    let mode = null;          // active gesture: 'rect' | 'lasso' | 'brush'
    let origin = null, current = null, shape = null, additive = true;
    let lassoPts = [], brushHits = 0;

    function begin(e){
      const oe = e.originalEvent;
      if(!oe || oe.button !== 0) return;
      // Shift always means rectangle, whatever tool is armed
      mode = oe.shiftKey ? 'rect' : (mapTool || null);
      if(!mode || mode === 'measure') return;
      additive = !oe.altKey;              // Alt inverts the gesture into a deselect
      origin = current = e.latlng;
      map.dragging.disable();
      L.DomUtil.disableTextSelection();

      const skin = {color:'#7A5F2A', weight:1.5, dashArray:'5,4',
                    fillColor:'#BA9863', fillOpacity:.12, interactive:false};
      if(mode === 'rect'){
        shape = L.rectangle([origin, origin], skin).addTo(map);
      } else if(mode === 'lasso'){
        lassoPts = [[e.latlng.lat, e.latlng.lng]];
        shape = L.polygon([lassoPts], skin).addTo(map);
      } else {
        brushHits = 0;
        paintAt(e.latlng);
      }
    }

    function paintAt(latlng){
      selectableTargets().forEach(pm=>{
        if(selected.has(pm.idx) === additive) return;
        const layer = mapLayers[pm.idx];
        if(!layer.getBounds().contains(latlng)) return;      // cheap reject first
        if(!pointInPlacemark(pm, latlng.lat, latlng.lng)) return;
        setSelected(pm, additive);
        brushHits++;
        updateSelectionUI();       // table is re-rendered once, at the end of the stroke
      });
    }

    function move(e){
      if(!mode) return;
      current = e.latlng;
      if(mode === 'rect'){
        shape.setBounds(L.latLngBounds(origin, current));
      } else if(mode === 'lasso'){
        lassoPts.push([e.latlng.lat, e.latlng.lng]);
        shape.setLatLngs([lassoPts]);
      } else {
        paintAt(e.latlng);
      }
    }

    function finish(){
      if(!mode) return;
      const gesture = mode;
      mode = null;
      boxSelectEndedAt = Date.now();   // swallow the click the browser fires after a drag
      map.dragging.enable();
      L.DomUtil.enableTextSelection();
      if(shape){ map.removeLayer(shape); shape = null; }

      if(gesture === 'brush'){
        renderTable();
        announceDrag(brushHits, additive);
        return;
      }

      let changed = 0;
      if(gesture === 'rect'){
        const bounds = L.latLngBounds(origin, current);
        // a click without a real drag shouldn't sweep anything up
        const nw = map.latLngToContainerPoint(bounds.getNorthWest());
        const se = map.latLngToContainerPoint(bounds.getSouthEast());
        if(Math.abs(se.x - nw.x) < 5 && Math.abs(se.y - nw.y) < 5) return;
        selectableTargets().forEach(pm=>{
          if(selected.has(pm.idx) === additive) return;
          if(!bounds.intersects(mapLayers[pm.idx].getBounds())) return;
          setSelected(pm, additive);
          changed++;
        });
      } else {
        if(lassoPts.length < 3) return;
        const lassoBounds = L.latLngBounds(lassoPts);
        selectableTargets().forEach(pm=>{
          if(selected.has(pm.idx) === additive) return;
          if(!placemarkInLasso(pm, lassoPts, lassoBounds)) return;
          setSelected(pm, additive);
          changed++;
        });
        lassoPts = [];
      }
      renderTable();
      announceDrag(changed, additive);
    }

    map.on('click', (e)=>{ if(mapTool === 'measure'){ L.DomEvent.stop(e.originalEvent); measureClick(e.latlng); } });
    map.on('mousedown', begin);
    map.on('mousemove', move);
    map.on('mouseup', finish);
    // mouse released outside the map container
    document.addEventListener('mouseup', ()=>{ if(mode) finish(); });
  }

  function setMapTool(tool){
    mapTool = tool || null;
    Array.from(mapTools.querySelectorAll('button')).forEach(b=>{
      b.classList.toggle('active', (b.dataset.tool || null) === mapTool);
    });
    if(leafletMap){
      L.DomUtil[mapTool ? 'addClass' : 'removeClass'](leafletMap.getContainer(), 'leaflet-crosshair');
    }
  }

  mapTools.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-tool]');
    if(!btn) return;
    const tool = btn.dataset.tool || null;
    setMapTool(mapTool === tool ? null : tool);
    if(mapTool !== 'measure') clearMeasure();
    if(mapTool){
      showToast(mapTool === 'measure' ? t('measHint') : mapTool === 'brush' ? t('brushTip') : t('drawTip'));
    }
  });

  function legendLabelOf(pm){
    const f = pm.fields.find(x=>/land use level 0?1 description/i.test(x.key));
    if(f && f.val) return f.val;
    // no land-use field: fall back to the style id, minus the prefix merging added
    return (pm.styleId || '').replace(/^f\d+_/, '');
  }

  // ---------- Per-file visibility panel ----------
  function renderFilesPanel(){
    if(sources.length < 2){ mapFiles.style.display = 'none'; return; }
    mapFiles.style.display = 'block';
    const rows = sources.map(s=>{
      const live = placemarks.filter(p=>p.sourceId === s.id).length;
      const on = s.visible !== false;
      // a <div>, not a <label>: a label re-dispatches the click onto the checkbox and toggles twice
      return `<div class="lg-row${on ? '' : ' off'}" data-file="${s.id}">
        <input type="checkbox" ${on ? 'checked' : ''}>
        <span class="lg-name" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</span>
        <span class="lg-count">${live}</span></div>`;
    }).join('');
    mapFiles.innerHTML = `<div class="lg-head-row">
        <span class="lg-name">${escapeHtml(t('filesPanelHead'))}</span>
        <button data-vis="all">${escapeHtml(t('showAll'))}</button>
        <button data-vis="none">${escapeHtml(t('hideAll'))}</button>
      </div>` + rows;
  }

  function setSourceVisible(source, on){
    source.visible = on;
    const mine = placemarks.filter(p=>p.sourceId === source.id);
    // never leave invisible plots selected — they would be deleted unseen
    if(!on) mine.forEach(p=> selected.delete(p.idx));
    mine.forEach(refreshPlacemarkVisual);
  }

  mapFiles.addEventListener('click', (e)=>{
    const bulk = e.target.closest('button[data-vis]');
    if(bulk){
      const on = bulk.dataset.vis === 'all';
      sources.forEach(s=> setSourceVisible(s, on));
      renderFilesPanel();
      buildMapLegend();
      renderTable();
      markSession();
      showToast(on ? t('shownAllFiles') : t('hiddenAllFiles'));
      return;
    }
    const row = e.target.closest('.lg-row[data-file]');
    if(!row) return;
    const source = sources.find(s=>s.id === Number(row.dataset.file));
    if(!source) return;
    // the click may land on the checkbox itself or on the row around it
    const box = row.querySelector('input');
    const on = (e.target === box) ? box.checked : (source.visible === false);
    setSourceVisible(source, on);
    renderFilesPanel();
    buildMapLegend();
    renderTable();
    markSession();
    showToast(on ? t('fileShown', {name: source.name}) : t('fileHidden', {name: source.name}));
  });

  function buildMapLegend(){
    // Merged files often repeat the same land use under different style ids —
    // group by label+colour so one category is one legend row.
    const groups = new Map();
    inVisibleSources().forEach(pm=>{
      if(!pm.styleId) return;
      const colour = (styleColorMap[pm.styleId] || {fill:DEFAULT_FILL}).fill.hex;
      const label = legendLabelOf(pm);
      const key = label + '|' + colour;
      let g = groups.get(key);
      if(!g){ g = {label, colour, ids:new Set(), count:0}; groups.set(key, g); }
      g.ids.add(pm.styleId);
      g.count++;
    });
    // keep the style ids in JS and reference groups by index — no escaping games
    legendGroups = [...groups.values()].sort((a,b)=> b.count - a.count);
    const rows = legendGroups.map((g, i)=>{
      const on = [...g.ids].some(id=> !hiddenStyles.has(id));
      return `<div class="lg-row${on ? '' : ' off'}" data-group="${i}">
        <input type="checkbox" ${on ? 'checked' : ''} title="${escapeHtml(t('legendVisTip'))}">
        <span class="lg-swatch" style="background:${g.colour}"></span>
        <span class="lg-name" title="${escapeHtml(g.label)}">${escapeHtml(g.label)}</span>
        <span class="lg-count">${g.count}</span>
        <button class="lg-pick" data-pick="${i}" title="${escapeHtml(t('legendTip'))}">${svgIcon('checkSquare')}</button>
      </div>`;
    });
    mapLegend.innerHTML = rows.length
      ? `<div class="lg-head-row">
          <span class="lg-name">${escapeHtml(t('legendHead'))}</span>
          <button data-cat="all">${escapeHtml(t('showAll'))}</button>
          <button data-cat="none">${escapeHtml(t('hideAll'))}</button>
        </div>` + rows.join('')
      : '';
  }

  function setCategoryVisible(group, on){
    group.ids.forEach(id=>{ if(on) hiddenStyles.delete(id); else hiddenStyles.add(id); });
    const touched = placemarks.filter(p=> group.ids.has(p.styleId));
    // never leave hidden plots selected — they must not be deletable while out of sight
    if(!on) touched.forEach(p=> selected.delete(p.idx));
    touched.forEach(refreshPlacemarkVisual);
  }

  mapLegend.addEventListener('click', (e)=>{
    const bulk = e.target.closest('button[data-cat]');
    if(bulk){
      const on = bulk.dataset.cat === 'all';
      legendGroups.forEach(g=> setCategoryVisible(g, on));
      buildMapLegend();
      renderTable();
      showToast(on ? t('shownAllCats') : t('hiddenAllCats'));
      return;
    }
    // the ☑ button still selects every plot in the category
    const pick = e.target.closest('button[data-pick]');
    if(pick){
      const group = legendGroups[Number(pick.dataset.pick)];
      const targets = activePlacemarks().filter(p=> group && group.ids.has(p.styleId));
      if(!targets.length){ showToast(t('noMatching')); return; }
      const allSelected = targets.every(p=>selected.has(p.idx));
      targets.forEach(p=> setSelected(p, !allSelected));
      renderTable();
      showToast(allSelected ? t('deselectedCategory') : t('selectedCategory', {n: targets.length}));
      return;
    }
    const row = e.target.closest('.lg-row[data-group]');
    if(!row) return;
    const group = legendGroups[Number(row.dataset.group)];
    if(!group) return;
    const box = row.querySelector('input');
    const on = (e.target === box) ? box.checked : !([...group.ids].some(id=> !hiddenStyles.has(id)));
    setCategoryVisible(group, on);
    buildMapLegend();
    renderTable();
    showToast(on ? t('catShown', {name: group.label}) : t('catHidden', {name: group.label}));
  });

  // Every placemark whose polygon genuinely contains the click point, not
  // just the one Leaflet happened to hand us — overlapping zoning/boundary
  // layers are common in real KMZ data, and clicking should surface all of
  // them (with paging), not silently show whichever one was drawn on top.
  function placemarksAtPoint(latlng){
    const hits = activePlacemarks().filter(p=>{
      const lyr = mapLayers[p.idx];
      return lyr && p.rings && lyr.getBounds().contains(latlng) && pointInPlacemark(p, latlng.lat, latlng.lng);
    });
    hits.sort((a, b)=> placemarkAreaM2(a) - placemarkAreaM2(b));  // smallest/most-specific first
    return hits;
  }

  function showQuickPopup(pm, layer, latlng){
    const stack = latlng ? placemarksAtPoint(latlng) : [pm];
    let idx = Math.max(0, stack.indexOf(pm));
    if(idx < 0) idx = 0;
    if(!stack.length) stack.push(pm);

    const container = document.createElement('div');
    container.className = 'map-popup';
    // Without this, a click on any button inside the popup (pager, select,
    // edit...) bubbles out to the map and triggers Leaflet's default
    // close-popup-on-map-click behavior before our own handler's effect is
    // visible — the popup would vanish on every interaction. Leaflet only
    // auto-applies this to its own static content, not to a live container
    // we keep mutating via innerHTML.
    L.DomEvent.disableClickPropagation(container);

    // A map-level popup, not layer.bindPopup(). bindPopup() permanently
    // registers Leaflet's OWN internal click-to-toggle handler on the layer
    // the first time it's called — which then fights every subsequent click
    // with this function's own "always rebuild and reopen" logic: click
    // opens (our handler), then Leaflet's own toggle handler immediately
    // sees "already open" and closes it again, in the same event. Opening a
    // standalone L.popup() on the map instead avoids that entanglement
    // entirely — this function is already the sole owner of the popup's
    // lifecycle, so there's nothing for Leaflet's auto-toggle to help with.
    const anchor = latlng || layer.getBounds().getCenter();
    // closeOnClick:false is the actual fix — without it, Leaflet closes this
    // popup the moment ANY click is handled while it's open (confirmed: even
    // a click that changes nothing but re-renders the same content closes
    // it), regardless of disableClickPropagation on the content. This
    // function is the sole owner of the popup's lifecycle (see the explicit
    // leafletMap.closePopup(popup) calls below), so ceding that to Leaflet's
    // default click-anywhere-closes behavior was never correct here.
    const popup = L.popup({maxWidth: 300, autoPanPadding: [20, 20], closeOnClick: false})
      .setLatLng(anchor).setContent(container);
    popup.openOn(leafletMap);

    function render(){
      const cur = stack[idx];
      const fieldRows = cur.fields.length
        ? cur.fields.map(f=>`<tr><td>${escapeHtml(f.key)}</td><td>${escapeHtml(f.val || '—')}</td></tr>`).join('')
        : `<div class="mp-empty">${escapeHtml(t('noData'))}</div>`;
      const pagerHtml = stack.length > 1 ? `
        <div class="mp-pager">
          <div class="mp-nav">
            <button class="mp-arrow" data-act="prev" ${idx===0?'disabled':''}>${svgIcon('chevronDown').replace('<svg', '<svg style="transform:rotate(90deg)"')}</button>
            <span class="mp-count">${idx+1} / ${stack.length}</span>
            <button class="mp-arrow" data-act="next" ${idx===stack.length-1?'disabled':''}>${svgIcon('chevronDown').replace('<svg', '<svg style="transform:rotate(-90deg)"')}</button>
          </div>
          <button class="mp-viewall" data-act="viewall">${escapeHtml(t('mpViewAll'))}</button>
        </div>` : '';

      container.innerHTML = `
        <div class="mp-header">
          <div class="mp-title">${escapeHtml(cur.name)}</div>
          <button class="mp-icon" data-act="zoom" title="${escapeHtml(t('featZoom'))}">${svgIcon('zoomIn')}</button>
          <button class="mp-icon" data-act="close" title="${escapeHtml(t('close'))}">${svgIcon('close')}</button>
        </div>
        ${cur.title ? `<div class="mp-sub">${escapeHtml(cur.title)}</div>` : ''}
        <div class="mp-body-scroll"><table class="mp-table">${fieldRows}</table></div>
        <div class="mp-actions">
          <button class="btn btn-gold btn-sm" data-act="edit">${escapeHtml(t('edit'))}</button>
          <button class="btn btn-outline btn-sm" data-act="del">${escapeHtml(cur.deleted?t('restore'):t('del'))}</button>
          <button class="btn btn-outline btn-sm" data-act="sel">${escapeHtml(selected.has(cur.idx)?t('deselect'):t('select'))}</button>
        </div>
        ${pagerHtml}`;

      popup.update();  // recalculates popup position/size after content height changes
    }

    // A single delegated listener on the never-replaced `container`, instead
    // of rebinding one listener per button on every render(). Rebinding
    // meant a button's OWN click handler could call render() and destroy
    // that same button's DOM node (via innerHTML) while its click event was
    // still bubbling — a fragile pattern regardless of whether it was the
    // actual cause of the popup closing unexpectedly during testing.
    // Delegation reads `stack[idx]` fresh on every click, so it's immune to
    // that class of bug entirely.
    container.addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-act]');
      if(!btn) return;
      const cur = stack[idx];
      switch(btn.dataset.act){
        case 'zoom': {
          const lyr = mapLayers[cur.idx];
          if(lyr) leafletMap.fitBounds(lyr.getBounds(), {padding:[60,60], maxZoom:19});
          break;
        }
        case 'close':
          leafletMap.closePopup(popup);
          break;
        case 'sel': {
          const on = setSelected(cur);
          renderTable();
          showToast(on ? t('selectedOne', {name: cur.name}) : t('deselectedOne', {name: cur.name}));
          render();
          break;
        }
        case 'edit':
          leafletMap.closePopup(popup);
          openPanel(cur);
          break;
        case 'del': {
          const prev = cur.deleted;
          cur.deleted = !prev;
          refreshPlacemarkVisual(cur);
          renderTable();
          markSession();
          pushDeleteChange([{pm: cur, prev}], cur.deleted, cur.deleted ? t('opDelete') : t('opRestore'));
          showToast(cur.deleted ? t('markedDeleted', {name: cur.name}) : t('restored', {name: cur.name}));
          if(stack.length > 1) render(); else leafletMap.closePopup(popup);
          break;
        }
        case 'prev':
          if(idx > 0){ idx--; render(); }
          break;
        case 'next':
          if(idx < stack.length - 1){ idx++; render(); }
          break;
        case 'viewall':
          stack.forEach(p=> setSelected(p, true));
          renderTable();
          leafletMap.closePopup(popup);
          showToast(t('selectedN', {n: stack.length}));
          break;
      }
    });

    render();
  }

  function effectiveFill(){ return fillMode; }

  function refreshPlacemarkVisual(pm){
    const layer = mapLayers[pm.idx];
    if(!layer) return;
    // plots from a hidden file or category leave the map entirely rather than just fading
    if(!plotVisible(pm)){
      if(mapLayerGroup && mapLayerGroup.hasLayer(layer)) mapLayerGroup.removeLayer(layer);
      return;
    }
    if(mapLayerGroup && !mapLayerGroup.hasLayer(layer)) mapLayerGroup.addLayer(layer);
    const style = styleColorMap[pm.styleId] || {fill:DEFAULT_FILL, line:DEFAULT_LINE};
    const matches = matchesSearch(pm);
    const outline = effectiveFill() === 'outline';
    // never drop fill to a flat 0: a fully transparent interior stops catching clicks
    const faint = 0.08;
    if(selected.has(pm.idx)){
      // selection always wins visually so the group being acted on is unmistakable
      layer.setStyle({
        color:'#7A5F2A', weight: outline ? 4 : 3, opacity:1,
        fillColor: pm.deleted ? '#B84A3E' : '#BA9863',
        fillOpacity: outline ? (pm.deleted ? .18 : .3) : (pm.deleted ? .25 : .6),
        dashArray: pm.deleted ? '5,5' : null
      });
      return;
    }
    if(pm.deleted){
      layer.setStyle({color:'#B84A3E', weight:2, opacity:.9, fillColor:'#B84A3E',
                      fillOpacity: outline ? faint : .12, dashArray:'5,5'});
    } else if(outline){
      // stroke in the category's own fill colour — the KML line colour is usually near-black
      layer.setStyle({
        color: style.fill.hex,
        weight: pm.dirty ? 3.5 : 2.5,
        opacity: matches ? 1 : 0.12,
        fillColor: style.fill.hex,
        fillOpacity: matches ? faint : 0.02,
        dashArray: null
      });
    } else if(pm.dirty){
      layer.setStyle({color:'#BA9863', weight:2, opacity:1, fillColor:style.fill.hex, fillOpacity:style.fill.alpha, dashArray:null});
    } else {
      layer.setStyle({color:style.line.hex, weight:1, opacity: matches?style.line.alpha:0.06, fillColor:style.fill.hex, fillOpacity: matches?style.fill.alpha:0.03, dashArray:null});
    }
  }

  function fieldValueOf(pm, key){
    if(key === NAME_KEY) return pm.name;

  function distinctValues(key){

    return [...counts.entries()].sort((a,b)=> b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), 'ar'));

  function parsePastedList(){

      .split(/[\n,;\t]+/)

  function pasteMatches(){
    const tokens = parsePastedList();
    if(!tokens.length) return {matches:[], tokens:[], missing:[]};
    const key = selPasteField.value;
    const hit = new Set();
    const matches = [];
    activePlacemarks().forEach(pm=>{
      const hay = key
        ? [fieldValueOf(pm, key)]
        : [pm.name, ...pm.fields.map(f=>f.val)];
      const lower = hay.map(v=>String(v).trim().toLowerCase());
      const found = tokens.find(t=> lower.includes(t));
      if(found !== undefined){ matches.push(pm); hit.add(found); }
    });
    return {matches, tokens, missing: tokens.filter(t=>!hit.has(t))};
  }

  // ---------- Toolbox ----------
  function fillToolboxFields(){
    const keys = allFieldKeys();
    const opts = `<option value="${NAME_KEY}">${escapeHtml(t('fieldName'))}</option>` +
      keys.map(k=>`<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('');
    const keep = (el, html)=>{ const v = el.value; el.innerHTML = html; if(v) el.value = v; };
    keep(tbDupField, opts);

    keep(tbStatsField, opts);

    if(areaKey && !tbStatsField.value) tbStatsField.value = areaKey;
  }

  // rough centroid + area of a plot's outer rings, in degree units (only used for comparison)
  function geomSignature(pm){
    if(!pm.rings) return null;
    let cx = 0, cy = 0, n = 0, area2 = 0;
    pm.rings.forEach(part=>{
      const ring = part[0];
      for(let i = 0; i < ring.length; i++){
        cy += ring[i][0]; cx += ring[i][1]; n++;
        const j = (i + 1) % ring.length;
        area2 += ring[i][1] * ring[j][0] - ring[j][1] * ring[i][0];
      }
    });
    if(!n) return null;
    return {cx: cx / n, cy: cy / n, area: Math.abs(area2 / 2), n};
  }

  function findDuplicates(mode){
    const targets = activePlacemarks();
    const extras = [];      // everything after the first member of each group
    let groups = 0;
    if(mode === 'field'){
      const key = tbDupField.value;
      const seen = new Map();
      targets.forEach(pm=>{
        const v = String(fieldValueOf(pm, key)).trim().toLowerCase();
        if(!v) return;
        if(!seen.has(v)) seen.set(v, []);
        seen.get(v).push(pm);
      });
      seen.forEach(list=>{ if(list.length > 1){ groups++; extras.push(...list.slice(1)); } });
    } else if(mode === 'geometry'){
      const seen = new Map();
      targets.forEach(pm=>{
        const s = geomSignature(pm);
        if(!s) return;
        // 6 decimals ≈ 10cm, enough to call two plots the same geometry
        const key = [s.cx.toFixed(6), s.cy.toFixed(6), s.area.toExponential(6), s.n].join('|');
        if(!seen.has(key)) seen.set(key, []);
        seen.get(key).push(pm);
      });
      seen.forEach(list=>{ if(list.length > 1){ groups++; extras.push(...list.slice(1)); } });
    } else {
      // overlap: plots from different files whose centroid falls inside another plot
      const withBounds = targets.filter(pm=> mapLayers[pm.idx] && pm.rings);
      const sigs = new Map(withBounds.map(pm=>[pm.idx, geomSignature(pm)]));
      withBounds.forEach(pm=>{
        const s = sigs.get(pm.idx);
        if(!s) return;
        const hit = withBounds.find(other=>
          other !== pm && other.sourceId !== pm.sourceId &&
          mapLayers[other.idx].getBounds().contains(L.latLng(s.cy, s.cx)) &&
          pointInPlacemark(other, s.cy, s.cx));
        if(hit) extras.push(pm);
      });
      groups = extras.length;
    }
    return {extras, groups};
  }

  tbCalcOp.addEventListener('change', ()=>{
    tbCalcB.style.display = tbCalcOp.value === 'replace' ? 'block' : 'none';
    updateCalcHint();
  });
  function updateCalcHint(){
    tbCalcHint.innerHTML = t('tbCalcTarget', {n: selected.size});
  }

  tbCalcRun.addEventListener('click', ()=>{
    const targets = selectedPlacemarks().filter(plotVisible);
    if(!targets.length){ showToast(t('tbCalcNeedSelection')); return; }
    const key = tbCalcField.value, op = tbCalcOp.value;
    const a = tbCalcA.value, b = tbCalcB.value;
    if(op !== 'set' && !a){ showToast(t('tbCalcNeedValue')); return; }
    if(!confirm(t('tbCalcConfirm', {n: targets.length, field: key === NAME_KEY ? t('fieldName') : key}))) return;

    const items = [];
    let touched = 0;
    targets.forEach(pm=>{
      const before = snapshotAttrs(pm);
      const current = String(fieldValueOf(pm, key));
      let next = current;
      if(op === 'set') next = a;
      else if(op === 'replace') next = current.split(a).join(b);
      else if(op === 'prefix') next = a + current;
      else if(op === 'suffix') next = current + a;
      if(next === current) return;
      if(key === NAME_KEY) pm.name = next;
      else {
        const f = pm.fields.find(x=>x.key === key);
        if(f) f.val = next; else return;   // don't invent fields the placemark doesn't have
      }
      pm.dirty = true;
      writePlacemarkToDom(pm);
      items.push({pm, before, after: snapshotAttrs(pm)});
      touched++;
    });
    if(!touched){ showToast(t('tbCalcNoChange')); return; }
    pushAttrChange(items, t('opFieldCalc', {n: touched}));
    renderTable();
    markSession();
    showToast(t('tbCalcDone', {n: touched}));
  });

  function computeStats(){
    const key = tbStatsField.value;
    const scope = tbStatsScope.value === 'selection' ? selectedPlacemarks().filter(plotVisible) : activePlacemarks();
    const nums = [];
    scope.forEach(pm=>{
      const v = parseFloat(String(fieldValueOf(pm, key)).replace(/,/g, ''));
      if(!isNaN(v)) nums.push(v);
    });
    const fmt = n => (Math.round(n * 100) / 100).toLocaleString(lang === 'ar' ? 'ar-SA' : 'en-US');
    if(!scope.length){ tbStatsOut.innerHTML = `<div class="stats-empty">${escapeHtml(t('tbStatsEmpty'))}</div>`; return; }
    const rows = [[t('tbStatCount'), scope.length.toLocaleString()]];
    if(nums.length){
      const sum = nums.reduce((s, v)=> s + v, 0);
      rows.push([t('tbStatNumeric'), nums.length.toLocaleString()],
                [t('tbStatSum'), fmt(sum)],
                [t('tbStatMean'), fmt(sum / nums.length)],
                [t('tbStatMin'), fmt(Math.min(...nums))],
                [t('tbStatMax'), fmt(Math.max(...nums))]);
    } else {
      rows.push([t('tbStatNumeric'), '0']);
    }
    tbStatsOut.innerHTML = rows.map(([k, v])=>
      `<span class="sk">${escapeHtml(k)}</span><span class="sv">${escapeHtml(String(v))}</span>`).join('');
  }
  tbStatsRun.addEventListener('click', computeStats);
  tbStatsField.addEventListener('change', computeStats);
  tbStatsScope.addEventListener('change', computeStats);

  tbExportSel.addEventListener('click', async ()=>{
    const chosen = selectedPlacemarks().filter(plotVisible);
    if(!chosen.length){ showToast(t('tbExportNeedSelection')); return; }
    try{
      const keep = new Set();
      const all = Array.from(xmlDoc.getElementsByTagName('Placemark'));
      const idxOf = new Map(all.map((n, i)=>[n, i]));
      chosen.forEach(pm=>{ const i = idxOf.get(pm.node); if(i !== undefined) keep.add(i); });

      const clone = xmlDoc.cloneNode(true);
      const cloneNodes = Array.from(clone.getElementsByTagName('Placemark'));
      cloneNodes.forEach((n, i)=>{ if(!keep.has(i) && n.parentNode) n.parentNode.removeChild(n); });

      let kmlText = new XMLSerializer().serializeToString(clone);
      if(!kmlText.startsWith('<?xml')) kmlText = '<?xml version="1.0" encoding="UTF-8"?>\n' + kmlText;
      const zip = new JSZip();
      zip.file('doc.kml', kmlText);
      const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = originalFileName + '_selection.kmz';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast(t('tbExportDone', {n: chosen.length}));
    }catch(err){
      console.error(err);
      showToast(t('exportError', {msg: err.message}));
    }
  });

    overlay.classList.add('open');

  // ---------- Batch actions ----------
  function batchSetDeleted(flag){
    const targets = selectedPlacemarks();
    if(!targets.length) return;
    const changing = targets.filter(p=>p.deleted !== flag);
    if(!changing.length){
      showToast(flag ? t('allAlreadyDeleted') : t('noneDeletedInSel'));
      return;
    }
    if(flag && changing.length >= 20 &&
       !confirm(t('confirmBulkDelete', {n: changing.length}))) return;
    const items = changing.map(p=>({pm:p, prev:p.deleted}));
    changing.forEach(p=>{ p.deleted = flag; refreshPlacemarkVisual(p); });
    renderTable();
    markSession();
    pushDeleteChange(items, flag, flag ? t('opBulkDelete', {n: changing.length}) : t('opBulkRestore', {n: changing.length}));
    showToast(flag ? t('markedN', {n: changing.length}) : t('restoredN', {n: changing.length}));
  }

  document.getElementById('bbDelete').addEventListener('click', ()=> batchSetDeleted(true));
  document.getElementById('bbRestore').addEventListener('click', ()=> batchSetDeleted(false));
  document.getElementById('bbClear').addEventListener('click', ()=> clearSelection());

  document.getElementById('bbInvert').addEventListener('click', ()=>{
    const targets = placemarks.filter(matchesSearch);
    targets.forEach(p=> setSelected(p, !selected.has(p.idx)));
    renderTable();
    showToast(t('nowSelected', {n: selected.size}));
  });

  document.getElementById('bbZoom').addEventListener('click', ()=>{
    const pts = [];
    selectedPlacemarks().forEach(p=>{
      if(!p.rings) return;
      p.rings.forEach(part=> part.forEach(ring=> ring.forEach(pt=> pts.push(pt))));
    });
    if(!pts.length){ showToast(t('noGeometry')); return; }
    setView('map');
    setTimeout(()=>{ leafletMap.invalidateSize(); leafletMap.fitBounds(pts, {padding:[40,40]}); }, 60);
  });

  function setView(view){
    currentView = view;
    viewMapBtn.classList.toggle('active', view==='map');
    viewTableBtn.classList.toggle('active', view==='table');
    mapWrap.style.display = view==='map' ? 'block' : 'none';
    tableWrap.style.display = view==='table' ? 'block' : 'none';
    if(view==='map' && leafletMap){
      setTimeout(()=>{ leafletMap.invalidateSize(); fitMapIfVisible(); }, 50);
    }
  }

  viewMapBtn.addEventListener('click', ()=> setView('map'));
  viewTableBtn.addEventListener('click', ()=> setView('table'));

  // preview columns: name + first few informative fields (rest available in edit panel)
  let previewKeys = [];
  function buildColumns(){
    const keyCount = {};
    placemarks.forEach(pm=> pm.fields.forEach(f=>{ keyCount[f.key] = (keyCount[f.key]||0)+1; }));
    // pick keys present in most rows, cap at 6 preview columns
    previewKeys = Object.keys(keyCount)
      .sort((a,b)=> keyCount[b]-keyCount[a])
      .slice(0, 6);

    const arrow = k => sortKey === k ? (sortDir > 0 ? ' ▲' : ' ▼') : '';
    theadRow.innerHTML = `<th><input type="checkbox" id="selAllChk" title="${escapeHtml(t('selectAllShown'))}"></th>` +
      `<th class="sortable" data-sort="${NAME_KEY}" title="${escapeHtml(t('sortTip'))}">${escapeHtml(t('colName'))}${arrow(NAME_KEY)}</th>` +
      previewKeys.map(k=>`<th class="sortable" data-sort="${escapeHtml(k)}" title="${escapeHtml(t('sortTip'))}">${escapeHtml(k)}${arrow(k)}</th>`).join('') +
      `<th>${escapeHtml(t('colActions'))}</th>`;

    document.getElementById('selAllChk').addEventListener('click', ()=> selectShownBtn.click());

    // QGIS-style attribute sorting: click a header, click again to reverse
    Array.from(theadRow.querySelectorAll('th.sortable')).forEach(th=>{
      th.addEventListener('click', ()=>{
        const k = th.dataset.sort;
        if(sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
        buildColumns();
        renderTable();
      });
    });
  }

  // a hidden source or category is filtered out everywhere: map, table, counts,
  // bulk tools and the edit panel
  function sourceVisible(pm){
    const s = sources.find(x=>x.id === pm.sourceId);
    return !s || s.visible !== false;
  }
  function styleVisible(pm){
    return !pm.styleId || !hiddenStyles.has(pm.styleId);
  }
  function plotVisible(pm){ return sourceVisible(pm) && styleVisible(pm); }

  function matchesSearch(pm){
    if(!plotVisible(pm)) return false;
    if(!searchTerm) return true;
    const t = searchTerm.toLowerCase();
    if(pm.name.toLowerCase().includes(t)) return true;
    if(sources.length > 1 && (pm.sourceName || '').toLowerCase().includes(t)) return true;
    return pm.fields.some(f=> f.val.toLowerCase().includes(t) || f.key.toLowerCase().includes(t));
  }

  // ---------- Writing attribute changes back into the KML DOM ----------
  function writePlacemarkToDom(pm){
    const ns = xmlDoc.documentElement.namespaceURI;
    if(!pm.nameEl){
      // some placemarks ship without a <name>; create one rather than dropping the edit
      pm.nameEl = ns ? xmlDoc.createElementNS(ns, 'name') : xmlDoc.createElement('name');
      pm.node.insertBefore(pm.nameEl, pm.node.firstChild);
    }
    pm.nameEl.textContent = pm.name;

    // Only rebuild the description when we actually parsed fields out of it.
    // Descriptions that aren't in the RCU table format would otherwise be
    // replaced by an empty table — silently destroying the original content.
    if(pm.descEl && pm.fields.length){
      const newHtml = buildDescriptionHtml(pm.title, pm.fields);
      while(pm.descEl.firstChild) pm.descEl.removeChild(pm.descEl.firstChild);
      pm.descEl.appendChild(xmlDoc.createCDATASection(newHtml));
    }
  }

  function snapshotAttrs(pm){
    return {name: pm.name, fields: pm.fields.map(f=>({...f})), dirty: pm.dirty};
  }

  // ---------- Undo / redo ----------
  const history = {stack: [], pos: -1, limit: 40};

  function pushHistory(entry){
    history.stack.splice(history.pos + 1);
    history.stack.push(entry);
    if(history.stack.length > history.limit) history.stack.shift();
    history.pos = history.stack.length - 1;
    updateHistoryButtons();
  }

  function updateHistoryButtons(){
    undoBtn.disabled = history.pos < 0;
    redoBtn.disabled = history.pos >= history.stack.length - 1;
    undoBtn.title = history.pos >= 0 ? t('undoOf', {what: history.stack[history.pos].label}) : t('undo');
    redoBtn.title = history.pos < history.stack.length - 1
      ? t('redoOf', {what: history.stack[history.pos + 1].label}) : t('redo');
  }

  function doUndo(){
    if(history.pos < 0){ showToast(t('nothingToUndo')); return; }
    const e = history.stack[history.pos];
    e.undo();
    history.pos--;
    updateHistoryButtons();
    showToast(t('undone', {what: e.label}));
  }
  function doRedo(){
    if(history.pos >= history.stack.length - 1){ showToast(t('nothingToRedo')); return; }
    const e = history.stack[++history.pos];
    e.redo();
    updateHistoryButtons();
    showToast(t('redone', {what: e.label}));
  }

  function pushDeleteChange(items, flag, label){
    const apply = value => {
      items.forEach(it=>{ it.pm.deleted = (value === null ? it.prev : value); refreshPlacemarkVisual(it.pm); });
      renderTable(); markSession();
    };
    pushHistory({label, undo: ()=> apply(null), redo: ()=> apply(flag)});
  }

  function pushAttrChange(items, label){
    if(!items.length) return;
    const apply = which => {
      items.forEach(it=>{
        const s = it[which];
        it.pm.name = s.name;
        it.pm.fields = s.fields.map(f=>({...f}));
        it.pm.dirty = s.dirty;
        writePlacemarkToDom(it.pm);
        refreshPlacemarkVisual(it.pm);
      });
      renderTable(); markSession();
    };
    pushHistory({label: label || t('opEdit'), undo: ()=> apply('before'), redo: ()=> apply('after')});
  }

  // numeric-aware comparison so "Area" sorts as numbers, not text
  function compareForSort(a, b){
    const av = fieldValueOf(a, sortKey), bv = fieldValueOf(b, sortKey);
    const an = parseFloat(String(av).replace(/,/g, '')), bn = parseFloat(String(bv).replace(/,/g, ''));
    const numeric = !isNaN(an) && !isNaN(bn) && /^[\s\d.,+-]+$/.test(String(av)) && /^[\s\d.,+-]+$/.test(String(bv));
    if(numeric) return (an - bn) * sortDir;
    return String(av).localeCompare(String(bv), undefined, {numeric:true}) * sortDir;
  }

  function renderTable(){
    tbody.innerHTML = '';
    shownOrder = [];
    let shown = 0, modifiedCount = 0, deletedCount = 0;
    placemarks.forEach(pm=>{
      if(pm.dirty) modifiedCount++;
      if(pm.deleted) deletedCount++;
    });
    const rows = placemarks.filter(matchesSearch);
    if(sortKey) rows.sort(compareForSort);
    rows.forEach(pm=>{
      shown++;
      shownOrder.push(pm.idx);
      const isSel = selected.has(pm.idx);
      const tr = document.createElement('tr');
      tr.className = (pm.deleted?'deleted ':'') + (pm.dirty?'modified ':'') + (isSel?'selected':'');
      const fieldMap = {};
      pm.fields.forEach(f=> fieldMap[f.key]=f.val);
      let rowHtml = `<td><input type="checkbox" data-sel="${pm.idx}" ${isSel?'checked':''}></td>` +
        `<td>${escapeHtml(pm.name)}</td>`;
      previewKeys.forEach(k=>{
        rowHtml += `<td title="${escapeHtml(fieldMap[k]||'')}">${escapeHtml(fieldMap[k]||'')}</td>`;
      });
      rowHtml += `<td><div class="row-actions">
          <button class="icon-btn" data-act="edit" data-idx="${pm.idx}" title="${escapeHtml(t('edit'))}" ${pm.deleted?'disabled':''}>${svgIcon('edit')}</button>
          <button class="icon-btn danger" data-act="del" data-idx="${pm.idx}" title="${escapeHtml(pm.deleted?t('restore'):t('del'))}">${pm.deleted?svgIcon('restore'):svgIcon('trash')}</button>
        </div></td>`;
      tr.innerHTML = rowHtml;
      tbody.appendChild(tr);
    });
    statTotal.textContent = placemarks.length;
    statShown.textContent = shown;
    if(modifiedCount>0){ pillModified.style.display='inline-block'; pillModified.textContent = t('pillModified', {n: modifiedCount}); } else pillModified.style.display='none';
    if(deletedCount>0){ pillDeleted.style.display='inline-block'; pillDeleted.textContent = t('pillDeleted', {n: deletedCount}); } else pillDeleted.style.display='none';
    updateSelectionUI();
  }

  searchInput.addEventListener('input', ()=>{
    searchTerm = searchInput.value.trim();
    renderTable();
    refreshAllMapVisuals();
  });

  tbody.addEventListener('click', (e)=>{
    const chk = e.target.closest('input[data-sel]');
    if(chk){
      const idx = Number(chk.dataset.sel);
      const on = chk.checked;
      if(e.shiftKey && lastAnchorIdx !== null && lastAnchorIdx !== idx){
        // extend the previous click into a contiguous range over the visible rows
        const a = shownOrder.indexOf(lastAnchorIdx), b = shownOrder.indexOf(idx);
        if(a !== -1 && b !== -1){
          shownOrder.slice(Math.min(a,b), Math.max(a,b)+1).forEach(i=>{
            const pm = placemarks.find(p=>p.idx===i);
            if(pm) setSelected(pm, on);
          });
        }
      } else {
        const pm = placemarks.find(p=>p.idx===idx);
        if(pm) setSelected(pm, on);
      }
      renderTable();
      lastAnchorIdx = idx;   // set after render: updateSelectionUI clears the anchor when nothing is selected
      return;
    }
    const btn = e.target.closest('button[data-act]');
    if(!btn) return;
    const idx = Number(btn.dataset.idx);
    const pm = placemarks.find(p=>p.idx===idx);
    if(!pm) return;
    if(btn.dataset.act === 'edit'){
      openPanel(pm);
    } else if(btn.dataset.act === 'del'){
      const prev = pm.deleted;
      pm.deleted = !prev;
      renderTable();
      refreshPlacemarkVisual(pm);
      markSession();
      pushDeleteChange([{pm, prev}], pm.deleted, pm.deleted ? t('opDelete') : t('opRestore'));
      showToast(pm.deleted ? t('markedDeleted', {name: pm.name}) : t('restored', {name: pm.name}));
    }
  });

  // ---------- Edit panel ----------
  function openPanel(pm){
    activeIndex = pm.idx;
    draftName = pm.name;
    draftFields = pm.fields.map(f=>({...f}));
    panelTitle.textContent = t('editPlot', {name: pm.name});
    renderPanelBody(pm);
    panel.classList.add('open');
    overlay.classList.add('open');
    panel.classList.toggle('has-changes', pm.dirty);
  }

  function renderPanelBody(pm){
    panelBody.innerHTML = '';
    const nameField = document.createElement('div');
    nameField.className = 'field';
    nameField.innerHTML = `<label>${escapeHtml(t('fieldName'))}</label><input type="text" data-key="__name__" value="${escapeHtml(draftName)}">`;
    panelBody.appendChild(nameField);

    draftFields.forEach((f, i)=>{
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const isLong = f.val.length > 40;
      wrap.innerHTML = `<label>${escapeHtml(f.key)}</label>` +
        (isLong
          ? `<textarea rows="2" data-idx="${i}">${escapeHtml(f.val)}</textarea>`
          : `<input type="text" data-idx="${i}" value="${escapeHtml(f.val)}">`);
      panelBody.appendChild(wrap);
    });
  }

  panelBody.addEventListener('input', (e)=>{
    const target = e.target;
    if(target.dataset.key === '__name__'){
      draftName = target.value;
    } else if(target.dataset.idx !== undefined){
      draftFields[Number(target.dataset.idx)].val = target.value;
    }
    target.closest('.field').classList.add('changed');
  });

  function closePanel(){
    panel.classList.remove('open');
    activeIndex = null;
    if(!selPanel.classList.contains('open')) overlay.classList.remove('open');
  }
  panelClose.addEventListener('click', closePanel);
  panelCancel.addEventListener('click', closePanel);
  overlay.addEventListener('click', ()=>{ closePanel(); closeSelPanel(); });

  panelSave.addEventListener('click', ()=>{
    const pm = placemarks.find(p=>p.idx===activeIndex);
    if(!pm) return;
    const before = snapshotAttrs(pm);
    const changed = (pm.name !== draftName) ||
      JSON.stringify(pm.fields) !== JSON.stringify(draftFields);
    pm.name = draftName;
    pm.fields = draftFields;
    if(changed) pm.dirty = true;

    writePlacemarkToDom(pm);
    pushAttrChange([{pm, before, after: snapshotAttrs(pm)}]);
    closePanel();
    renderTable();
    refreshPlacemarkVisual(pm);
    markSession();
    showToast(t('savedEdit', {name: pm.name}));
  });

  // ---------- Reset all ----------
  // Drop every loaded file and return to the empty state.
  function clearWorkspace(){
    fileInput.value = '';
    placemarks = [];
    sources = [];
    xmlDoc = null;
    nextIdx = 0;
    selected.clear();
    lastAnchorIdx = null;
    pendingFit = null;
    updateSelectionUI();
    setSelectMode(false);
    setMapTool(null);
    if(kmShellReady) refreshShell();
    closeSelPanel();
    selValues.innerHTML = '';
    selPasteText.value = '';
    filesPop.classList.remove('open');
    filesBtn.style.display = 'none';
    mapFiles.style.display = 'none';
    history.stack.length = 0; history.pos = -1; updateHistoryButtons();
    if(mapLayerGroup) mapLayerGroup.clearLayers();
    Object.keys(mapLayers).forEach(k=>delete mapLayers[k]);
    toolbar.style.display = 'none';
    tableWrap.style.display = 'none';
    mapWrap.style.display = 'block';
    emptyState.style.display = 'flex';
    if(leafletMap) setTimeout(()=>leafletMap.invalidateSize(), 60);
    exportBtn.disabled = true;
    resetBtn.disabled = true;
  }

  resetBtn.addEventListener('click', ()=>{
    if(!confirm(t('confirmReset'))) return;
    if(!xmlDoc) return;
    // edits are written straight into the DOM, so the only true undo is a re-read
    clearWorkspace();
    clearSavedSession();
    showToast(t('reloadOriginal'));
  });

  function svgIcon(name){
    const body = ICONS[name];
    if(!body) return '';
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  }

  // applyI18n writes textContent, which wipes children — so icons are painted after it
  function paintIcons(root){
    (root || document).querySelectorAll('[data-icon]').forEach(el=>{
      const existing = el.querySelector(':scope > .ico');
      if(existing) existing.remove();

  // ---------- Session persistence (IndexedDB: the merged KML can be tens of MB) ----------
  const DB_NAME = 'kmzEditor', DB_STORE = 'session', DB_KEY = 'current';
  function openDb(){
    return new Promise((res, rej)=>{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore(DB_STORE); };
      req.onsuccess = ()=> res(req.result);
      req.onerror = ()=> rej(req.error);
    });
  }
  function dbOp(mode, fn){
    return openDb().then(db=> new Promise((res, rej)=>{
      const tx = db.transaction(DB_STORE, mode);
      const out = fn(tx.objectStore(DB_STORE));
      tx.oncomplete = ()=> res(out && out.result !== undefined ? out.result : out);
      tx.onerror = ()=> rej(tx.error);
    }));
  }

  async function saveSession(){
    if(!xmlDoc) return false;
    const nodes = Array.from(xmlDoc.getElementsByTagName('Placemark'));
    const idxOf = new Map(nodes.map((n, i)=>[n, i]));
    const payload = {
      version: 1,
      savedAt: Date.now(),
      originalFileName,
      kml: new XMLSerializer().serializeToString(xmlDoc),
      sources: sources.map(s=>({id:s.id, name:s.name, visible: s.visible !== false})),
      hiddenStyles: [...hiddenStyles],
      // deleted/dirty flags keyed by the placemark's position in the document
      flags: placemarks.map(p=>({d: idxOf.get(p.node), s: p.sourceId, del: !!p.deleted, dty: !!p.dirty}))
                       .filter(f=> f.d !== undefined)
    };
    await dbOp('readwrite', st=> st.put(payload, DB_KEY));
    lastSavedAt = payload.savedAt;
    sessionDirty = false;
    updateSaveBtn();
    return true;
  }

  async function restoreSession(){
    let data = null;
    try{ data = await dbOp('readonly', st=> st.get(DB_KEY)); }catch(e){ return false; }
    if(!data || !data.kml) return false;
    const doc = new DOMParser().parseFromString(data.kml, 'text/xml');
    if(doc.querySelector('parsererror')) return false;
    xmlDoc = doc;
    originalFileName = data.originalFileName || 'map';
    sources = (data.sources || []).map(s=>({id:s.id, name:s.name, visible: s.visible !== false, folder:null}));
    // re-link each source to its folder by name, so removing a file still works
    Array.from(xmlDoc.getElementsByTagName('Folder')).forEach(f=>{
      const n = f.getElementsByTagName('name')[0];
      if(!n) return;
      const s = sources.find(x=> x.name === n.textContent.trim() && !x.folder);
      if(s) s.folder = f;
    });
    const flagByDoc = new Map((data.flags || []).map(f=>[f.d, f]));
    const fallback = sources[0] || {id:0, name:'', visible:true};
    nextIdx = 0;
    placemarks = Array.from(xmlDoc.getElementsByTagName('Placemark')).map((node, di)=>{
      const f = flagByDoc.get(di);
      const src = (f && sources.find(s=>s.id === f.s)) || fallback;
      const pm = buildPlacemark(node, src);
      if(f){ pm.deleted = !!f.del; pm.dirty = !!f.dty; }
      return pm;
    }).filter(pm => pm.fields.length > 0 || pm.name);
    hiddenStyles.clear();
    (data.hiddenStyles || []).forEach(id=> hiddenStyles.add(id));
    lastSavedAt = data.savedAt || null;
    refreshAfterSourceChange();
    sessionDirty = false;
    updateSaveBtn();
    return true;
  }

  function clearSavedSession(){
    return dbOp('readwrite', st=> st.delete(DB_KEY)).catch(()=>{});
  }

  // any change worth keeping schedules a background save
  function markSession(){
    if(!xmlDoc) return;

    if(e.key === 'Escape'){
      if(panel.classList.contains('open')) closePanel();

    if((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')){
      e.preventDefault();
      if(e.shiftKey) doRedo(); else doUndo();
      return;
    }
    if((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')){ e.preventDefault(); doRedo(); return; }

      let kmlText = serializer.serializeToString(xmlDoc);
      if(!kmlText.startsWith('<?xml')){

      }
      const zip = new JSZip();
      zip.file('doc.kml', kmlText);
      const blob = await zip.generateAsync({type:'blob', compression:'DEFLATE'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = originalFileName + (sources.length > 1 ? '_merged.kmz' : '_edited.kmz');

  // ---- KPI strip, computed from what is actually loaded ----
  function areaFieldKey(){
    return allFieldKeys().find(k=>/^area|area\s*\(|area_|hectare/i.test(k)) || null;
  }
  function sumArea(list){
    const key = areaFieldKey();
    if(!key) return null;
    let s = 0, seen = 0;
    list.forEach(pm=>{
      const v = parseFloat(String(fieldValueOf(pm, key)).replace(/,/g, ''));
      if(!isNaN(v)){ s += v; seen++; }
    });
    return seen ? {sum:s, key} : null;
  }
  function fmtNum(n){
    if(n >= 1e6) return (n/1e6).toFixed(1) + 'M';
    if(n >= 1e4) return Math.round(n/1e3) + 'K';
    return Math.round(n).toLocaleString(lang === 'ar' ? 'ar-EG' : 'en-US');
  }

    const m = s.match(/(?:select|show|highlight|حدد|أظهر|اظهر)\s+(.+)/);
    if(m){
      const term = m[1].trim().replace(/^["']|["']$/g, '');

  // ================= KEYMAP geospatial toolkit (no external libraries) =================
  const EARTH_R = 6371008.8;                     // IUGG mean radius, metres
  const rad = d => d * Math.PI / 180;
  const deg = r => r * 180 / Math.PI;

  // great-circle distance between [lat,lng] pairs, metres
  function haversine(a, b){
    const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
    const s = Math.sin(dLat/2)**2 +
              Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng/2)**2;
    return 2 * EARTH_R * Math.asin(Math.min(1, Math.sqrt(s)));
  }

  // spherical excess area of a closed ring of [lat,lng], square metres
  function ringAreaM2(ring){
    if(!ring || ring.length < 3) return 0;
    let total = 0;
    for(let i = 0; i < ring.length; i++){
      const p1 = ring[i], p2 = ring[(i + 1) % ring.length];
      total += rad(p2[1] - p1[1]) * (2 + Math.sin(rad(p1[0])) + Math.sin(rad(p2[0])));
    }
    return Math.abs(total * EARTH_R * EARTH_R / 2);
  }

  // a placemark's true area: outer rings minus holes
  function placemarkAreaM2(pm){
    if(!pm.rings) return 0;
    let a = 0;
    pm.rings.forEach(part=>{
      a += ringAreaM2(part[0]);
      for(let h = 1; h < part.length; h++) a -= ringAreaM2(part[h]);
    });
    return Math.max(0, a);
  }

  function ringPerimeterM(ring){
    let p = 0;
    for(let i = 0; i < ring.length - 1; i++) p += haversine(ring[i], ring[i+1]);
    return p;
  }

  function placemarkCentroid(pm){
    if(!pm.rings) return null;
    // area-weighted centroid of the outer rings
    let cx = 0, cy = 0, wsum = 0;
    pm.rings.forEach(part=>{
      const ring = part[0], w = ringAreaM2(ring) || 1;
      let sx = 0, sy = 0;
      ring.forEach(p=>{ sy += p[0]; sx += p[1]; });
      cy += (sy / ring.length) * w; cx += (sx / ring.length) * w; wsum += w;
    });
    return wsum ? [cy / wsum, cx / wsum] : null;
  }

  // initial bearing a->b in degrees (0 = north)
  function bearingDeg(a, b){
    const y = Math.sin(rad(b[1]-a[1])) * Math.cos(rad(b[0]));
    const x = Math.cos(rad(a[0]))*Math.sin(rad(b[0])) -
              Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));
    return (deg(Math.atan2(y, x)) + 360) % 360;
  }

  // interior angle at b for the path a-b-c, degrees
  function angleAt(a, b, c){
    let d = Math.abs(bearingDeg(b, a) - bearingDeg(b, c));
    if(d > 180) d = 360 - d;
    return d;
  }

  function fmtDist(m){
    return m >= 1000 ? (m/1000).toFixed(2) + ' km' : m.toFixed(1) + ' m';
  }
  function fmtArea(m2){
    if(m2 >= 1e6) return (m2/1e6).toFixed(3) + ' km²';
    if(m2 >= 10000) return (m2/10000).toFixed(2) + ' ha';
    return m2.toFixed(1) + ' m²';
  }

  function redrawMeasure(){
    measureLayers.forEach(l=> leafletMap.removeLayer(l));
    measureLayers = [];
    if(!measurePts.length) return;
    const style = {color:'#C89B3C', weight:2, dashArray:'6,4', fillColor:'#C89B3C', fillOpacity:.12};
    if(measureMode === 'area' && measurePts.length >= 3){
      measureLayers.push(L.polygon(measurePts, style).addTo(leafletMap));
    } else if(measurePts.length >= 2){
      measureLayers.push(L.polyline(measurePts, style).addTo(leafletMap));
    }
    measurePts.forEach(p=> measureLayers.push(
      L.circleMarker(p, {radius:4, color:'#C89B3C', fillColor:'#0B1220', fillOpacity:1, weight:2}).addTo(leafletMap)));

    let html = '';
    if(measureMode === 'distance'){
      let total = 0;
      for(let i = 0; i < measurePts.length - 1; i++) total += haversine(measurePts[i], measurePts[i+1]);
      const last = measurePts.length >= 2
        ? haversine(measurePts[measurePts.length-2], measurePts[measurePts.length-1]) : 0;
      html = `<b>${escapeHtml(t('measTotal'))}</b> ${fmtDist(total)}` +

    } else if(measureMode === 'area'){
      const ring = measurePts.slice();

      html = `<b>${escapeHtml(t('measArea'))}</b> ${fmtArea(a)}` +

       </div>`;
    measureHud.classList.add('show');
  }

  // ---------- Spatial join ----------
  function spatialJoin(sourceId, targetId, field){
    const src = placemarks.filter(p=>p.sourceId === sourceId);
    const tgt = placemarks.filter(p=>p.sourceId === targetId);
    const items = [];
    let matched = 0;      // target plots whose centroid falls inside a source plot
    let changed = 0;      // of those, how many actually got a new value written
    tgt.forEach(pm=>{
      const c = placemarkCentroid(pm);
      if(!c) return;
      const host = src.find(s=>{
        const layer = mapLayers[s.idx];
        return layer && layer.getBounds().contains(L.latLng(c[0], c[1])) &&
               pointInPlacemark(s, c[0], c[1]);
      });
      if(!host) return;
      matched++;
      const val = String(fieldValueOf(host, field));
      const existing = pm.fields.find(f=>f.key === field);
      if(existing && existing.val === val) return;   // spatially matched, nothing to update
      const before = snapshotAttrs(pm);
      if(existing) existing.val = val;
      else pm.fields.push({key: field, val});
      pm.dirty = true;
      writePlacemarkToDom(pm);
      items.push({pm, before, after: snapshotAttrs(pm)});
      changed++;
    });
    if(items.length) pushAttrChange(items, t('opSpatialJoin', {n: items.length}));
    return {matched, changed, target: tgt.length};
  }

  // ---------- Buffer ----------
  // offsets every outer-ring vertex outward along the angle bisector
  let bufferLayer = null;
  function buildBuffer(list, metres){
    if(bufferLayer){ leafletMap.removeLayer(bufferLayer); bufferLayer = null; }
    const shapes = [];
    list.forEach(pm=>{
      if(!pm.rings) return;
      const c = placemarkCentroid(pm);
      if(!c) return;
      const mPerDegLat = 111132.0;
      const mPerDegLng = 111320.0 * Math.cos(rad(c[0])) || 1;
      pm.rings.forEach(part=>{
        const ring = part[0];
        const out = ring.map(p=>{
          const dy = p[0] - c[0], dx = p[1] - c[1];
          const len = Math.hypot(dy * mPerDegLat, dx * mPerDegLng) || 1;
          return [p[0] + (dy * mPerDegLat / len) * metres / mPerDegLat,
                  p[1] + (dx * mPerDegLng / len) * metres / mPerDegLng];
        });
        shapes.push(out);
      });
    });
    if(!shapes.length) return 0;
    bufferLayer = L.polygon(shapes, {
      color:'#4C9AFF', weight:1.5, fillColor:'#4C9AFF', fillOpacity:.15, dashArray:'5,4', interactive:false
    }).addTo(leafletMap);
    bufferLayer.bringToBack();
    return shapes.length;
  }

  // ---------- Heatmap ----------
  let heatLayer = null;
  function buildHeatmap(on){
    if(heatLayer){ leafletMap.removeLayer(heatLayer); heatLayer = null; }
    if(!on) return 0;
    const pts = [];
    activePlacemarks().forEach(pm=>{ const c = placemarkCentroid(pm); if(c) pts.push(c); });
    if(!pts.length) return 0;
    const Heat = L.Layer.extend({
      onAdd(map){
        this._c = L.DomUtil.create('canvas', 'leaflet-zoom-animated');
        const size = map.getSize();
        this._c.width = size.x; this._c.height = size.y;
        map.getPanes().overlayPane.appendChild(this._c);
        this._c.style.pointerEvents = 'none';
        map.on('moveend zoomend resize', this._draw, this);
        this._draw();
      },
      onRemove(map){
        map.off('moveend zoomend resize', this._draw, this);
        if(this._c && this._c.parentNode) this._c.parentNode.removeChild(this._c);
      },
      _draw(){
        const map = this._map, size = map.getSize();
        const tl = map.containerPointToLayerPoint([0, 0]);
        L.DomUtil.setPosition(this._c, tl);
        this._c.width = size.x; this._c.height = size.y;
        const ctx = this._c.getContext('2d');
        ctx.clearRect(0, 0, size.x, size.y);
        const r = 26;
        pts.forEach(p=>{
          const q = map.latLngToContainerPoint(L.latLng(p[0], p[1]));
          if(q.x < -r || q.y < -r || q.x > size.x + r || q.y > size.y + r) return;
          const g = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r);
          g.addColorStop(0, 'rgba(200,155,60,.55)');
          g.addColorStop(.5, 'rgba(224,101,91,.28)');
          g.addColorStop(1, 'rgba(11,18,32,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fill();
        });
      }
    });
    heatLayer = new Heat();
    leafletMap.addLayer(heatLayer);
    return pts.length;
  }

  // ---------- Clustering ----------
  let clusterLayer = null;
  function buildClusters(on){
    if(clusterLayer){ leafletMap.removeLayer(clusterLayer); clusterLayer = null; }
    if(!on) return 0;
    const cell = 0.01;   // ~1.1 km grid
    const bins = new Map();
    activePlacemarks().forEach(pm=>{
      const c = placemarkCentroid(pm);
      if(!c) return;
      const key = Math.round(c[0]/cell) + ':' + Math.round(c[1]/cell);
      if(!bins.has(key)) bins.set(key, {lat:0, lng:0, n:0, ids:[]});
      const b = bins.get(key);
      b.lat += c[0]; b.lng += c[1]; b.n++; b.ids.push(pm.idx);
    });
    clusterLayer = L.layerGroup();
    bins.forEach(b=>{
      const size = Math.min(46, 22 + Math.log2(b.n + 1) * 5);
      const m = L.marker([b.lat/b.n, b.lng/b.n], {icon: L.divIcon({
        className:'km-cluster', iconSize:[size, size],
        html:`<span style="width:${size}px;height:${size}px">${b.n}</span>`
      })});
      m.on('click', ()=>{

      clusterLayer.addLayer(m);

    clusterLayer.addTo(leafletMap);
    return bins.size;
  }

  // ---------- SQL-style filter ----------
  // FIELD OP VALUE [AND|OR ...]   field names may be "quoted"
  function parseSql(expr){
    const tokens = expr.split(/\s+(AND|OR|و|أو)\s+/i);
    const clauses = []; const joiners = [];
    for(let i = 0; i < tokens.length; i++){
      if(i % 2 === 1){ joiners.push(/^(or|أو)$/i.test(tokens[i]) ? 'OR' : 'AND'); continue; }
      const m = tokens[i].trim().match(/^(?:"([^"]+)"|'([^']+)'|([^\s><=!]+))\s*(>=|<=|!=|<>|=|>|<|LIKE|NOT LIKE)\s*(.+)$/i);
      if(!m) throw new Error(tokens[i].trim());
      const field = (m[1] || m[2] || m[3]).trim();
      const op = m[4].toUpperCase();
      let val = m[5].trim().replace(/^["']|["']$/g, '');
      clauses.push({field, op, val});
    }
    return {clauses, joiners};
  }

  function evalClause(pm, c){
    const raw = fieldValueOf(pm, c.field === '*' ? NAME_KEY : c.field);
    const a = String(raw).trim();
    const an = parseFloat(a.replace(/,/g, '')), bn = parseFloat(c.val.replace(/,/g, ''));
    const numeric = !isNaN(an) && !isNaN(bn);
    switch(c.op){
      case '=':  return numeric ? an === bn : a.toLowerCase() === c.val.toLowerCase();
      case '!=': case '<>': return numeric ? an !== bn : a.toLowerCase() !== c.val.toLowerCase();
      case '>':  return numeric ? an >  bn : a >  c.val;
      case '<':  return numeric ? an <  bn : a <  c.val;
      case '>=': return numeric ? an >= bn : a >= c.val;
      case '<=': return numeric ? an <= bn : a <= c.val;
      case 'LIKE': return a.toLowerCase().includes(c.val.toLowerCase().replace(/%/g, ''));
      case 'NOT LIKE': return !a.toLowerCase().includes(c.val.toLowerCase().replace(/%/g, ''));
    }
    return false;
  }

  function runSql(expr){
    const {clauses, joiners} = parseSql(expr);
    return activePlacemarks().filter(pm=>{
      let acc = evalClause(pm, clauses[0]);
      for(let i = 1; i < clauses.length; i++){
        const v = evalClause(pm, clauses[i]);
        acc = joiners[i-1] === 'OR' ? (acc || v) : (acc && v);
      }
      return acc;
    });
  }
